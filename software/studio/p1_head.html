<title>bob studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Tokens are docs/arch/p1_head.html's, so studio looks like the rest of the
     project. The layout is not: this is an application shell, not a sheet of paper. */
  :root {
    --ink: #17171a; --ink-2: #4a4a52; --mute: #74747e; --faint: #9a9aa4;
    --rule: #e4e4dd; --rule-2: #f0efe9; --paper: #ffffff; --desk: #b9b7b0;
    --accent: #b8500f; --accent-2: #d97a28; --accent-bg: #fdf6ef;
    --ok: #2f7d4f; --warn: #a8791b; --err: #b1342c;
    --run: #2b6ca3; --run-bg: #eef5fb;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --nav: 244px; --props: 268px; --dock: 210px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e9e8e3; --ink-2: #c0bfba; --mute: #8f8e89; --faint: #6d6c68;
      --rule: #34343a; --rule-2: #26262b; --paper: #1c1c20; --desk: #121215;
      --accent: #e08a45; --accent-2: #f0a468; --accent-bg: #2a2119;
      --ok: #5fb083; --warn: #d8ab4e; --err: #e4756b;
      --run: #6aa6d8; --run-bg: #1d2731;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9e8e3; --ink-2: #c0bfba; --mute: #8f8e89; --faint: #6d6c68;
    --rule: #34343a; --rule-2: #26262b; --paper: #1c1c20; --desk: #121215;
    --accent: #e08a45; --accent-2: #f0a468; --accent-bg: #2a2119;
    --ok: #5fb083; --warn: #d8ab4e; --err: #e4756b;
    --run: #6aa6d8; --run-bg: #1d2731;
  }

  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 13px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer }
  ::-webkit-scrollbar { width: 10px; height: 10px }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px }

  /* ── top bar ─────────────────────────────────────────────── */
  .bar {
    display: flex; gap: 14px; align-items: center; flex: none;
    padding: 0 14px; height: 46px; background: #1e1e22; color: #eceae4;
    border-bottom: 1px solid #000; font-size: 13px;
  }
  .bar .brand { font-weight: 620; letter-spacing: -.015em }
  .bar .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); flex: none }
  .bar .sp { flex: 1 }
  .bar .meta { font-family: var(--mono); font-size: 10.5px; color: #85858e; letter-spacing: .03em }
  .bar button {
    background: #303036; color: #eceae4; border: 1px solid #46464e;
    border-radius: 6px; padding: 5px 11px; font-size: 12px;
  }
  .bar button:hover { background: #3c3c44; border-color: #63636e }
  .bar .tgt { font-family: var(--mono); font-size: 11px; display: flex; align-items: center; gap: 6px }
  .led { width: 7px; height: 7px; border-radius: 50%; background: #55555e; flex: none }
  .led.on { background: var(--accent-2); box-shadow: 0 0 6px var(--accent-2) }
  .led.good { background: #4caf72; box-shadow: 0 0 6px #4caf72 }
  .led.bad { background: #d9534f; box-shadow: 0 0 6px #d9534f }

  /* ── app grid ────────────────────────────────────────────── */
  .app {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: var(--nav) minmax(0, 1fr) var(--props);
    grid-template-rows: minmax(0, 1fr) var(--dock);
  }
  .nav  { grid-area: 1 / 1 / 3 / 2; border-right: 1px solid var(--rule); overflow: auto }
  .main { grid-area: 1 / 2 / 2 / 3; min-width: 0; display: flex; flex-direction: column }
  .props{ grid-area: 1 / 3 / 2 / 4; border-left: 1px solid var(--rule); overflow: auto }
  .dock { grid-area: 2 / 2 / 3 / 4; border-top: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0 }

  /* ── flow navigator ──────────────────────────────────────── */
  .grp { border-bottom: 1px solid var(--rule-2); padding: 8px 0 10px }
  .grp > h3 {
    margin: 0; padding: 4px 14px 6px;
    font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--mute); font-weight: 600;
  }
  .item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 22px; color: var(--ink-2); cursor: pointer;
    border-left: 2px solid transparent; font-size: 12.5px;
  }
  .item:hover { background: var(--rule-2); color: var(--ink) }
  .item.on { border-left-color: var(--accent); color: var(--ink); background: var(--accent-bg); font-weight: 550 }
  .item .k { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-left: auto }
  .item.act { color: var(--accent); font-weight: 560 }
  .item.act::before { content: "▸"; font-size: 9px; color: var(--accent) }

  .st { width: 13px; text-align: center; font-size: 11px; flex: none; font-family: var(--mono) }
  .st.wait { color: var(--faint) }
  .st.run  { color: var(--run) }
  .st.ok   { color: var(--ok) }
  .st.err  { color: var(--err) }

  /* ── tabs ────────────────────────────────────────────────── */
  .tabs {
    display: flex; align-items: stretch; flex: none; height: 32px;
    border-bottom: 1px solid var(--rule); background: var(--rule-2);
    overflow-x: auto; overflow-y: hidden;
  }
  .tab {
    display: flex; align-items: center; gap: 7px; padding: 0 13px;
    font-size: 12px; color: var(--mute); cursor: pointer; white-space: nowrap;
    border-right: 1px solid var(--rule); background: transparent;
  }
  .tab.on { background: var(--paper); color: var(--ink); font-weight: 550; box-shadow: inset 0 2px 0 var(--accent) }
  .pane { flex: 1; min-height: 0; overflow: auto; position: relative; display: none }
  .pane.on { display: block }

  /* ── editor ──────────────────────────────────────────────── */
  .ed { position: relative; height: 100%; display: flex; font-family: var(--mono); font-size: 12.5px; line-height: 1.55 }
  .ed .gut {
    flex: none; padding: 10px 8px 10px 12px; text-align: right; color: var(--faint);
    background: var(--rule-2); border-right: 1px solid var(--rule);
    user-select: none; white-space: pre; min-width: 46px;
  }
  .ed .gut b { display: block; color: var(--err); font-weight: 700 }
  .ed .wrap { position: relative; flex: 1; min-width: 0; overflow: auto }
  .ed pre, .ed textarea {
    margin: 0; padding: 10px 14px; border: 0; font: inherit; line-height: inherit;
    white-space: pre; tab-size: 4; min-height: 100%;
  }
  .ed pre { pointer-events: none; color: var(--ink) }
  .ed textarea {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: transparent; color: transparent; caret-color: var(--accent);
    resize: none; outline: none; overflow: hidden;
  }
  .kw  { color: var(--accent); font-weight: 600 }
  .ty  { color: var(--run) }
  .num { color: var(--ok) }
  .cm  { color: var(--faint); font-style: italic }
  .str { color: var(--warn) }
  .mark { background: color-mix(in srgb, var(--err) 18%, transparent); box-shadow: 0 1px 0 var(--err) }

  /* ── device view ─────────────────────────────────────────── */
  .dev { padding: 14px; height: 100%; display: flex; flex-direction: column; gap: 10px }
  .dev .top { display: flex; align-items: center; gap: 14px; flex: none; flex-wrap: wrap }
  .dev svg { flex: 1; min-height: 0; width: 100%; height: auto }
  .sw { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2) }
  .sw input { accent-color: var(--accent) }
  .lg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--mute); font-family: var(--mono) }

  /* The pin planner and the bitstream browser scroll their own content: the pad ring
     must not grow until the assignment rows fall off the bottom. */
  #pinview, #bitview, #srcview, #setview, #boardview, #wavelist { overflow: auto; min-height: 0; flex: 1 }
  #pinview svg { flex: none; max-height: 340px; align-self: flex-start }
  .lg i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px }

  /* ── properties ──────────────────────────────────────────── */
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 14px; font-size: 12px }
  .row span:first-child { color: var(--mute) }
  .row span:last-child { font-family: var(--mono); font-size: 11.5px; text-align: right }
  .props select, .props input {
    font: inherit; font-size: 11.5px; padding: 2px 5px; width: 104px;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 4px;
  }
  .meter { padding: 4px 14px 7px }
  .meter .lab { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 3px }
  .meter .lab b { font-family: var(--mono); font-weight: 500; color: var(--ink-2) }
  .meter .bg { height: 5px; background: var(--rule-2); border-radius: 3px; overflow: hidden }
  .meter .fg { height: 100%; background: var(--accent); border-radius: 3px; transition: width .35s }
  .meter.hot .fg { background: var(--err) }

  /* ── dock ────────────────────────────────────────────────── */
  .dock .tabs { background: var(--rule-2) }
  .dock .body { flex: 1; min-height: 0; overflow: auto; font-family: var(--mono); font-size: 11.5px }
  .msg { display: flex; gap: 9px; padding: 3px 14px; border-bottom: 1px solid var(--rule-2); align-items: baseline }
  .msg:hover { background: var(--rule-2) }
  .msg .sev { flex: none; width: 13px; text-align: center }
  .msg.error .sev { color: var(--err) } .msg.warning .sev { color: var(--warn) } .msg.info .sev { color: var(--mute) }
  .msg .loc { flex: none; color: var(--run); cursor: pointer; text-decoration: underline dotted }
  .msg .txt { color: var(--ink-2); min-width: 0 }
  .msg .src { margin-left: auto; color: var(--faint); font-size: 10px; flex: none }
  .stg { display: flex; gap: 10px; padding: 3px 14px; align-items: baseline; border-bottom: 1px solid var(--rule-2) }
  .stg .nm { width: 62px; flex: none; color: var(--ink) }
  .stg .tm { width: 56px; flex: none; text-align: right; color: var(--mute) }
  .stg .dt { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .empty { padding: 16px; color: var(--faint); font-family: var(--sans); font-size: 12px }

  .pill {
    font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 8px;
    border: 1px solid var(--rule); color: var(--mute); white-space: nowrap;
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--rule)) }
  .pill.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--rule)) }
  .pill.run { color: var(--run); border-color: color-mix(in srgb, var(--run) 40%, var(--rule)) }

  .go {
    margin: 8px 14px 2px; width: calc(100% - 28px); padding: 7px;
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    font-size: 12.5px; font-weight: 570;
  }
  .go:hover { background: var(--accent-2) }
  .go:disabled { background: var(--rule); color: var(--faint); cursor: default }
  .go.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent) }
  .go.sec:hover { background: var(--accent-bg) }
  .go.sec:disabled { border-color: var(--rule); color: var(--faint); background: transparent }

  /* ── projects and dialogs (M18) ──────────────────────────── */
  .modal { position: fixed; inset: 0; background: rgba(10,10,12,.42); display: flex;
    align-items: center; justify-content: center; z-index: 50 }
  .dlg { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px;
    width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 60px); display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(0,0,0,.28) }
  .dlg h2 { margin: 0; padding: 14px 18px 10px; font-size: 14px; font-weight: 620; border-bottom: 1px solid var(--rule-2) }
  .dlg .bd { padding: 12px 18px; overflow: auto; min-height: 0; flex: 1; font-size: 12.5px }
  .dlg .ft { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 18px 14px; border-top: 1px solid var(--rule-2) }
  .dlg .ft .go { margin: 0; width: auto; padding: 6px 16px }
  .dlg label.f { display: block; font-size: 11px; color: var(--mute); margin: 10px 0 4px; font-weight: 560 }
  .dlg input[type=text], .bdside input, .bdside select, .wires input {
    font: inherit; font-family: var(--mono); font-size: 12px; width: 100%; box-sizing: border-box; padding: 5px 7px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 5px }
  .fsl { border: 1px solid var(--rule); border-radius: 6px; max-height: 260px; overflow: auto; margin-top: 6px }
  .fsl div { padding: 4px 10px; font-family: var(--mono); font-size: 11.5px; cursor: pointer; display: flex; gap: 8px }
  .fsl div:hover { background: var(--rule-2) }
  .fsl div.sel { background: var(--accent-bg); color: var(--accent) }
  .fsl .ic { width: 14px; color: var(--faint); flex: none }
  .steps { display: flex; gap: 6px; margin-bottom: 8px; font-size: 11px; color: var(--faint) }
  .steps b { color: var(--accent) }
  .tree { font-size: 12.5px; max-width: 900px }
  .tree h4 { margin: 14px 0 4px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--mute) }
  .tree .ti { display: flex; gap: 8px; align-items: baseline; padding: 3px 8px; border-radius: 4px; cursor: pointer }
  .tree .ti:hover { background: var(--rule-2) }
  .tree .ti .nm { font-family: var(--mono); font-size: 12px }
  .tree .ti .sub { font-family: var(--mono); font-size: 10px; color: var(--faint) }
  .tree .ti .acts { margin-left: auto; display: flex; gap: 6px }
  .tree .ti .acts a { font-size: 10.5px; color: var(--run); cursor: pointer }
  .tree .ti.top .nm { font-weight: 700; color: var(--accent) }
  .tree .ti.miss .nm { color: var(--err); text-decoration: line-through }
  .ctx { position: fixed; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,.2); padding: 4px 0; min-width: 170px; font-size: 12px }
  .ctx div { padding: 5px 14px; cursor: pointer } .ctx div:hover { background: var(--rule-2) }

  /* ── block design canvas ─────────────────────────────────── */
  #pane-bd .dev { flex-direction: row; gap: 0; padding: 0 }
  #pane-wave .dev { padding: 0; gap: 0 }
  #pane-wave .dev > .top { padding: 8px 12px }
  .bdpal { width: 190px; flex: none; border-right: 1px solid var(--rule); overflow: auto; padding: 8px 0; font-size: 12px }
  .bdpal h4 { margin: 10px 12px 4px; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--mute) }
  .bdpal .pi { padding: 4px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px }
  .bdpal .pi:hover { background: var(--rule-2) }
  .bdpal .pi span:last-child { font-family: var(--mono); font-size: 10px; color: var(--faint) }
  .bdmid { flex: 1; min-width: 0; display: flex; flex-direction: column }
  .bdmid .top { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule-2); flex-wrap: wrap }
  .bdmid .top .go { margin: 0; width: auto; padding: 4px 12px }
  #bdsvg { flex: 1; min-height: 0; width: 100%; background:
    radial-gradient(circle, var(--rule) 1px, transparent 1px) 0 0 / 20px 20px; cursor: default; user-select: none }
  .wires { max-height: 150px; overflow: auto; border-top: 1px solid var(--rule-2); padding: 4px 12px; font-size: 11px }
  .wires .wr { display: grid; grid-template-columns: 1fr 18px 1fr 22px; gap: 6px; align-items: center; margin: 2px 0 }
  .wires .wr input { padding: 2px 5px; font-size: 11px }
  .wires .wr.bad input { border-color: var(--err) }
  .bdside { width: 230px; flex: none; border-left: 1px solid var(--rule); overflow: auto; padding: 10px 12px; font-size: 12px }
  .bdside h4 { margin: 4px 0 6px; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--mute) }
  .bdside label { display: block; font-size: 11px; color: var(--mute); margin: 8px 0 3px }
  .bdside .go { margin: 10px 0 0; width: 100% }
  .bdside .er { color: var(--err); font-size: 11px; margin: 4px 0; font-family: var(--mono) }
  .bdside .wa { color: var(--warn); font-size: 11px; margin: 4px 0; font-family: var(--mono) }
  .blk rect.body { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.2 }
  .blk.sel rect.body { stroke: var(--accent); stroke-width: 2 }
  .blk.board rect.body { fill: var(--rule-2); stroke-dasharray: 4 3 }
  .blk.ip rect.head { fill: var(--run-bg) } .blk.module rect.head { fill: var(--accent-bg) } .blk.board rect.head { fill: var(--rule) }
  .blk text { font-family: var(--mono); font-size: 11px; fill: var(--ink) }
  .blk text.ty { font-size: 9.5px; fill: var(--mute) }
  .blk .port circle { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.2; cursor: crosshair }
  .blk .port:hover circle { fill: var(--accent); stroke: var(--accent) }
  .blk .port.bad circle { fill: var(--err); stroke: var(--err) }
  .blk .port.bad text { fill: var(--err) }
  path.wire { fill: none; stroke: var(--run); stroke-width: 1.6 }
  path.wire.bus { stroke-width: 3 }
  path.wire.bad { stroke: var(--err) }
  path.wire:hover { stroke: var(--accent); cursor: pointer }
  path.ghost { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4 }

  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px minmax(0,1fr); grid-template-rows: minmax(0,1fr) var(--dock) }
    .props { display: none }
    .dock { grid-area: 2 / 2 / 3 / 3 }
  }

  /* ── Start page, hints, the next step (software UX pass) ── */
  .start { max-width: 1060px; margin: 0 auto; padding: 26px 30px 40px; font-family: var(--sans); color: var(--ink) }
  .start h1 { font-size: 22px; font-weight: 640; margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance }
  .start .lede { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; max-width: 68ch; line-height: 1.5 }
  .start h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute);
              font-weight: 600; margin: 26px 0 10px }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 1px solid var(--rule);
           border-radius: 6px; overflow: hidden; background: var(--paper) }
  .steps > div { padding: 11px 13px; border-right: 1px solid var(--rule); font-size: 12px; line-height: 1.45; color: var(--ink-2) }
  .steps > div:last-child { border-right: 0 }
  .steps b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 2px }
  .steps i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--accent) }
  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 26px; align-items: start }
  .cols > div, .ex .ds, .doc .d, .doc .fx { min-width: 0; overflow-wrap: anywhere }
  .exlist { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper) }
  .ex { display: grid; grid-template-columns: 86px 1fr auto; gap: 10px; align-items: center;
        padding: 8px 12px; border-bottom: 1px solid var(--rule-2); font-size: 12.5px }
  .ex:last-child { border-bottom: 0 }
  .ex .nm { font-family: var(--mono); font-weight: 600; color: var(--ink) }
  .ex .ds { color: var(--ink-2); line-height: 1.35 }
  .ex .bt { display: flex; gap: 6px }
  .sbtn { border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 4px;
          padding: 3px 9px; font-size: 11.5px; white-space: nowrap }
  .sbtn:hover { border-color: var(--accent); color: var(--accent) }
  .sbtn.pri { background: var(--accent); border-color: var(--accent); color: #fff }
  .sbtn.pri:hover { background: var(--accent-2); color: #fff }
  .card { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px }
  .card .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
  .card p { margin: 0; color: var(--ink-2); line-height: 1.45 }
  .recent a { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--run); cursor: pointer; padding: 2px 0;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .doc { display: grid; grid-template-columns: 30px 88px 1fr; gap: 6px; font-size: 11.5px; padding: 2px 0; align-items: baseline }
  .doc .m.ok { color: var(--ok) } .doc .m.bad { color: var(--err) } .doc .m.opt { color: var(--warn) }
  .doc .d { color: var(--ink-2) } .doc .fx { grid-column: 3; color: var(--mute); font-family: var(--mono); font-size: 10.5px }
  .keys { font-size: 11.5px; color: var(--ink-2); line-height: 1.7 }
