<title>FPGA Architecture — Interactive Die Floorplan &amp; Schematics</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @page { size: A3 landscape; margin: 8mm }

  :root {
    --ink: #17171a;
    --ink-2: #4a4a52;
    --mute: #74747e;
    --faint: #9a9aa4;
    --rule: #e4e4dd;
    --rule-2: #f0efe9;
    --paper: #ffffff;
    --desk: #b9b7b0;
    --accent: #b8500f;
    --accent-2: #d97a28;
    --accent-bg: #fdf6ef;
    --shadow: 0 1px 2px rgba(20,20,25,.05), 0 8px 30px rgba(20,20,25,.13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }

  * { box-sizing: border-box }

  html, body {
    margin: 0; padding: 0;
    background: var(--desk);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ───────────────────────── top bar ───────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 14px; align-items: center;
    padding: 0 18px; height: 46px;
    background: #1e1e22;
    color: #eceae4;
    font-size: 13px;
    border-bottom: 1px solid #000;
  }
  .bar .brand { font-weight: 620; letter-spacing: -.015em; font-size: 13.5px }
  .bar .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); flex: none }
  .bar .tip {
    font-family: var(--mono); font-size: 11px; color: #c9a071;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .bar .sp { flex: 1 }
  .bar .meta { font-family: var(--mono); font-size: 10.5px; color: #85858e; letter-spacing: .03em }
  .bar button {
    background: #303036; color: #eceae4;
    border: 1px solid #46464e; border-radius: 6px;
    padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .bar button:hover { background: #3c3c44; border-color: #63636e }

  /* ───────────────────────── sheet ───────────────────────── */
  .sheet {
    background: var(--paper);
    margin: 18px auto 26px;
    max-width: 1700px;
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto }

  .hit { cursor: pointer; fill: rgba(0,0,0,0); transition: fill .1s }
  .hit:hover { fill: rgba(217,122,40,.20); stroke: var(--accent); stroke-width: 1.6 }

  /* ───────────────────────── overlay card ───────────────────────── */
  .ov {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(16,16,19,.60);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 32px 20px 60px; overflow-y: auto;
  }
  .ov.on { display: flex }

  .card {
    background: var(--paper); border-radius: 14px;
    max-width: 1140px; width: 100%;
    box-shadow: 0 24px 70px rgba(0,0,0,.40);
    overflow: hidden;
    animation: rise .16s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  .chead {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 24px 16px; border-bottom: 1px solid var(--rule);
  }
  .chead .sw { width: 4px; height: 38px; border-radius: 2px; flex: none; margin-top: 3px }
  .chead h2 { margin: 0; font-size: 20px; letter-spacing: -.022em; font-weight: 640; line-height: 1.2 }
  .chead p { margin: 4px 0 0; font-size: 12px; color: var(--mute); font-family: var(--mono); letter-spacing: .01em }
  .chead .x {
    margin-left: auto; background: #f4f3ef; border: 1px solid var(--rule);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer;
    font-size: 14px; color: var(--ink-2); flex: none; line-height: 1;
  }
  .chead .x:hover { background: #eae9e3 }

  .crumb {
    padding: 9px 24px; background: #fbfaf7; border-bottom: 1px solid var(--rule-2);
    font-size: 11px; font-family: var(--mono); color: var(--faint);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .crumb button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0 }
  .crumb button:hover { text-decoration: underline }

  .cbody { padding: 20px 24px 26px }

  .dsvg {
    border: 1px solid var(--rule); border-radius: 10px;
    background: #fdfdfb; padding: 14px; overflow-x: auto;
  }
  .dsvg + .dsvg { margin-top: 12px }

  .sect {
    font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--faint);
    margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-2);
  }

  .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px }
  .notes li { font-size: 13.5px; line-height: 1.5; color: #35353c; padding-left: 17px; position: relative; max-width: 92ch }
  .notes li:before {
    content: ''; position: absolute; left: 0; top: .60em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
  }
  .notes b { color: var(--ink); font-weight: 620 }
  .notes code { font-family: var(--mono); font-size: 12px; background: #f4f3ef; padding: 1px 5px; border-radius: 4px }

  .chips { display: flex; gap: 8px; flex-wrap: wrap }
  .chips button {
    background: #fff; border: 1px solid #dddcd4; border-radius: 20px;
    padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; color: #3a3a42;
    transition: all .12s;
  }
  .chips button:hover { border-color: var(--accent-2); color: var(--accent); background: var(--accent-bg) }

  .lnk { margin-top: 20px; font-size: 12.5px; color: var(--mute) }
  .lnk a { color: var(--accent) }

  .dm { transition: fill .1s }
  .drillmark { cursor: pointer }

  /* ───────────────────────── live demo controls ───────────────────────── */
  .demo {
    margin-top: 12px; border: 1px solid var(--rule); border-radius: 10px;
    background: #fbfaf7; padding: 13px 15px;
  }
  .demo h4 {
    margin: 0 0 11px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint); font-weight: 500;
  }
  .demo h4 span { color: var(--accent); }
  .ctl { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
  .ctl .grp { display: flex; gap: 6px; align-items: center }
  .ctl label { font-family: var(--mono); font-size: 11px; color: var(--mute) }

  .sw6 {
    width: 34px; height: 30px; border-radius: 7px; cursor: pointer;
    border: 1px solid #d5d4cc; background: #fff; color: var(--faint);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.05; padding: 0; transition: all .12s;
  }
  .sw6 .n { font-size: 8px; letter-spacing: .04em; color: var(--faint) }
  .sw6.on { background: var(--accent); border-color: var(--accent); color: #fff }
  .sw6.on .n { color: rgba(255,255,255,.72) }
  .sw6:hover { border-color: var(--accent-2) }

  .demo select, .demo input[type=text] {
    font: inherit; font-family: var(--mono); font-size: 12px;
    padding: 5px 9px; border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; color: var(--ink);
  }
  .demo button.act {
    font: inherit; font-size: 12px; padding: 6px 12px;
    border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; cursor: pointer; color: #3a3a42;
  }
  .demo button.act:hover { border-color: var(--accent-2); color: var(--accent) }

  .led {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    padding: 6px 13px; border-radius: 7px; border: 1px solid;
    background: #f2f1ec; border-color: #ddddd4; color: var(--faint);
  }
  .led.hi { background: #1f7a44; border-color: #176034; color: #fff }

  .hexout { font-family: var(--mono); font-size: 11.5px; color: var(--mute) }
  .hexout b { color: var(--ink); font-weight: 600 }

  /* ───────────────────────── print ───────────────────────── */
  @media print {
    html, body { background: #fff }
    .bar, .ov { display: none !important }
    .sheet { margin: 0; max-width: none; box-shadow: none; border-radius: 0 }
    .hit { display: none }
  }
</style>

<div class="bar">
  <span class="dot"></span>
  <span class="brand">FPGA Top-Level Architecture</span>
  <span class="tip">▸ click any block to open it</span>
  <span class="sp"></span>
  <span class="meta">A3 landscape · ⌘P → Save as PDF</span>
  <button onclick="print()">Print / PDF</button>
</div>

<div class="sheet"><div id="out"></div></div>

<div class="ov" id="ov">
  <div class="card">
    <div class="chead">
      <div class="sw" id="dsw"></div>
      <div>
        <h2 id="dtitle"></h2>
        <p id="dsub"></p>
      </div>
      <button class="x" id="dx" title="close (Esc)">✕</button>
    </div>
    <div class="crumb" id="dcrumb"></div>
    <div class="cbody">
      <div id="dschemw"><div class="dsvg" id="dschem"></div><div id="ddemo"></div></div>
      <div id="drowsw"><div class="sect" id="drowshdr">Block diagram</div><div class="dsvg" id="ddiag"></div></div>
      <div id="dnotesw">
        <div class="sect">Key points</div>
        <ul class="notes" id="dnotes"></ul>
      </div>
      <div id="ddrillw">
        <div class="sect">Open a sub-block</div>
        <div class="chips" id="ddrill"></div>
      </div>
      <div class="lnk" id="dlnk"></div>
    </div>
  </div>
</div>

<script>
  "use strict";
  /* ============================================================================
     PALETTE  —  each family:  f = fill, s = stroke, t = text
     ========================================================================= */
  const C = {
    CLB:  { f: "#dce8f7", s: "#3f76ad", t: "#1d4b78" },
    BRAM: { f: "#d7ecdc", s: "#3d8a58", t: "#1f5c38" },
    DSP:  { f: "#f9e7c8", s: "#b3801f", t: "#78530f" },
    CMT:  { f: "#e6dcf3", s: "#7a58ab", t: "#4d3273" },
    IO:   { f: "#eae5db", s: "#8c8271", t: "#544d3f" },
    CFG:  { f: "#f8dbd3", s: "#bb5340", t: "#8a3423" },
    GTX:  { f: "#d6eaed", s: "#3a8189", t: "#215257" },
    HARD: { f: "#e0e5ea", s: "#68757f", t: "#39434b" },
    BRD:  { f: "#f2f1ec", s: "#7d7669", t: "#3a352c" },
    SOFT: { s: "#c05a12", t: "#8f4108", f: "rgba(192,90,18,.05)" },
    DIE:  { s: "#26262a" },
    INK: "#17171a", MUTE: "#74747e", FAINT: "#9a9aa4",
    LINE: "#b9b9b2", RULE: "#e4e4dd",
    WIRE: "#5c5c64", HOT: "#d97a28", HOT2: "#b8500f", GRN: "#1f7a44"
  };
  const MONO = "ui-monospace,'SF Mono',Menlo,Consolas,monospace";
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ============================================================================
     PRIMITIVES  —  every helper pushes markup into the current buffer S
     ========================================================================= */
  let S = [];

  function rect(x, y, w, h, o = {}) {
    S.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 2}"`
      + ` fill="${o.f ?? "none"}" stroke="${o.s ?? "none"}" stroke-width="${o.sw ?? 1}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.cls ? ` class="${o.cls}"` : "")
      + (o.op ? ` opacity="${o.op}"` : "") + "/>");
  }

  function txt(x, y, s, o = {}) {
    const rot = o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : "";
    S.push(`<text x="${x}" y="${y}"${rot} font-size="${o.size ?? 9}"`
      + ` fill="${o.fill ?? C.INK}" text-anchor="${o.anchor ?? "middle"}"`
      + ` font-weight="${o.w ?? 400}" font-family="${o.mono ? MONO : "inherit"}"`
      + ` letter-spacing="${o.ls ?? 0}"`
      + (o.op ? ` opacity="${o.op}"` : "") + `>${esc(s)}</text>`);
  }

  function line(x1, y1, x2, y2, o = {}) {
    S.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s ?? C.LINE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function path(d, o = {}) {
    S.push(`<path d="${d}" fill="${o.f ?? "none"}" stroke="${o.s ?? C.WIRE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linejoin="round" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function block(x, y, w, h, name, cap, k, o = {}) {
    rect(x, y, w, h, { f: k.f, s: k.s, sw: o.sw ?? 1.1, rx: o.rx ?? 3 });
    const cy = y + h / 2;
    if (cap) {
      txt(x + w / 2, cy - 1, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
      txt(x + w / 2, cy + 10, cap, { size: o.cs ?? 7.2, fill: C.MUTE, mono: true });
    } else {
      txt(x + w / 2, cy + 3.4, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
    }
  }

  /* transparent click target — always emitted last so it sits above the art.
     fill is a presentation attribute so the markup survives a CSS-less export. */
  function hit(id, x, y, w, h, rx) {
    S.push(`<rect class="hit" data-id="${id}" x="${x}" y="${y}" width="${w}" height="${h}"`
      + ` rx="${rx ?? 3}" fill="transparent" pointer-events="all"/>`);
  }

  /* ============================================================================
     SCHEMATIC TOOLKIT  —  real symbols, not labelled rectangles
     ========================================================================= */

  /* wire through a list of [x,y] points, orthogonal as drawn */
  function wire(pts, o = {}) {
    path("M" + pts.map(p => p.join(",")).join(" L"),
      { s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, dash: o.dash, marker: o.marker, cap: "round" });
  }

  /* junction dot */
  function dot(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.1}" fill="${o.s ?? C.WIRE}"/>`);
  }

  /* open pin circle (port boundary) */
  function port(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.6}" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
  }

  /* multiplexer — the classic tapered trapezoid.
     dir "r" = inputs on the left, output right.  sel drawn on the bottom edge. */
  function mux(x, y, w, h, o = {}) {
    const t = o.taper ?? Math.min(h * 0.22, 9);
    path(`M${x},${y} L${x + w},${y + t} L${x + w},${y + h - t} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.label) txt(x + w / 2 + 1, y + h / 2 + (o.lo ?? 3), o.label,
      { size: o.ls2 ?? 7.4, fill: o.lf ?? C.MUTE, mono: true, w: 600 });
    return { in: i => [x, y + h * i], out: [x + w, y + h / 2], sel: [x + w / 2, y + h] };
  }

  /* flip-flop / register — box with the clock wedge on the lower-left */
  function ff(x, y, w, h, o = {}) {
    rect(x, y, w, h, { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, rx: 1.5 });
    path(`M${x},${y + h - 11} L${x + 8},${y + h - 6.5} L${x},${y + h - 2}`,
      { s: o.s ?? C.WIRE, sw: 1.1 });
    if (o.label) txt(x + w / 2 + 3, y + h / 2 - 1, o.label, { size: o.ls2 ?? 7.6, fill: o.lf ?? C.INK, w: 620 });
    if (o.sub) txt(x + w / 2 + 3, y + h / 2 + 8.5, o.sub, { size: 6.2, fill: C.FAINT, mono: true });
    return { d: [x, y + 10], clk: [x, y + h - 6.5], q: [x + w, y + h / 2] };
  }

  /* buffer / inverter triangle pointing right */
  function buf(x, y, w, h, o = {}) {
    path(`M${x},${y} L${x + w},${y + h / 2} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
    return { in: [x, y + h / 2], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* AND / OR / XOR gate bodies (IEEE distinctive shapes) */
  function gate(kind, x, y, w, h, o = {}) {
    const s = o.s ?? C.WIRE, f = o.f ?? "#fff", sw = o.sw ?? 1.1;
    if (kind === "and") {
      path(`M${x},${y} L${x + w * .45},${y} A${w * .55},${h / 2} 0 0 1 ${x + w * .45},${y + h} L${x},${y + h} Z`, { f, s, sw });
    } else {
      const back = kind === "xor" ? 5 : 0;
      path(`M${x + back},${y} Q${x + back + w * .55},${y + h * .06} ${x + w},${y + h / 2}`
        + ` Q${x + back + w * .55},${y + h * .94} ${x + back},${y + h}`
        + ` Q${x + back + w * .22},${y + h / 2} ${x + back},${y} Z`, { f, s, sw });
      if (kind === "xor") path(`M${x},${y} Q${x + w * .22},${y + h / 2} ${x},${y + h}`, { s, sw });
    }
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${s}" stroke-width="${sw}"/>`);
    if (o.label) txt(x + w * .42, y + h / 2 + 2.6, o.label, { size: 6.4, fill: C.FAINT, mono: true });
    return { a: [x, y + h * .28], b: [x, y + h * .72], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* NMOS pass transistor — the thing a routing PIP and a LUT mux leg really are.
     `flip` puts the gate on the right, so a mirrored pair never crosses its own leads. */
  function nmos(x, y, o = {}) {
    const s = o.s ?? C.WIRE, h = o.h ?? 16, w = 7, d = o.flip ? 1 : -1;
    line(x, y, x, y + h, { s, sw: 1.3 });                              // channel
    line(x + d * w, y + 2, x + d * w, y + h - 2, { s, sw: 1.1 });       // gate plate
    line(x + d * w, y + h / 2, x + d * 14, y + h / 2, { s, sw: 1 });    // gate lead
    return { g: [x + d * 14, y + h / 2], s1: [x, y], s2: [x, y + h] };
  }

  /* the same device rotated for a left-to-right signal, as in an SRAM access
     transistor. The two leads jog perpendicular into the channel bar — without that
     jog the bar is collinear with the wire and the symbol reads as a capacitor.
     `y` is the level of the signal wire; the gate lead runs up to `gateTo`. */
  function nmosH(x, y, o = {}) {
    const s = o.s ?? C.WIRE, w = o.w ?? 28;
    const ch = y - 8, plate = y - 15, gy = o.gateTo ?? y - 34;
    line(x, y, x, ch, { s, sw: 1.1 });                           // left lead
    line(x + w, y, x + w, ch, { s, sw: 1.1 });                   // right lead
    line(x, ch, x + w, ch, { s, sw: 1.4 });                      // channel bar
    line(x + 3, plate, x + w - 3, plate, { s, sw: 1.4 });        // gate plate
    line(x + w / 2, plate, x + w / 2, gy, { s, sw: 1 });         // gate lead
    return { g: [x + w / 2, gy], t1: [x, y], t2: [x + w, y] };
  }

  /* a single SRAM configuration cell, drawn as a small square.
     v = 0/1 fills it; hot = highlight as the selected cell */
  function cell(x, y, w, h, v, o = {}) {
    const on = !!v;
    rect(x, y, w, h, {
      f: o.hot ? C.HOT : (on ? (o.onf ?? "#3f76ad") : (o.off ?? "#eef1f4")),
      s: o.hot ? C.HOT2 : (o.s ?? "#b6c2ce"), sw: o.hot ? 1.3 : .6, rx: 1
    });
    if (o.showv && h >= 8) txt(x + w / 2, y + h / 2 + 2.6, on ? "1" : "0",
      { size: 6, mono: true, fill: o.hot ? "#fff" : (on ? "#fff" : C.FAINT), w: 700 });
  }

  /* bus with a slash and a width label — standard schematic notation */
  function bus(x1, y1, x2, y2, n, o = {}) {
    line(x1, y1, x2, y2, { s: o.s ?? C.WIRE, sw: o.sw ?? 1.6, marker: o.marker });
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    line(mx - 3.5, my + 4, mx + 3.5, my - 4, { s: o.s ?? C.WIRE, sw: 1 });
    if (n) txt(mx + (o.dx ?? 6), my - (o.dy ?? 6), n, { size: 6.4, fill: o.nf ?? C.MUTE, mono: true, anchor: o.anchor ?? "start" });
  }

  /* dashed enclosure with a corner caption — "this whole region is one X" */
  function frame(x, y, w, h, label, o = {}) {
    rect(x, y, w, h, { s: o.s ?? C.LINE, sw: o.sw ?? 1, dash: o.dash ?? "5 4", rx: o.rx ?? 5, f: o.f ?? "none" });
    if (label) {
      const lw = label.length * 4.4 + 10;
      rect(x + 10, y - 6.5, lw, 13, { f: o.bg ?? "#fdfdfb", rx: 3 });
      txt(x + 15, y + 2.6, label, { size: 6.9, anchor: "start", fill: o.lf ?? C.MUTE, mono: true, ls: .5, w: 600 });
    }
  }

  /* small caption under a symbol */
  function cap(x, y, s, o = {}) {
    txt(x, y, s, { size: o.size ?? 6.4, fill: o.fill ?? C.FAINT, mono: true, anchor: o.anchor ?? "middle", ls: .3 });
  }

  /* section heading inside a schematic */
  function hdr(x, y, s, o = {}) {
    txt(x, y, s.toUpperCase(), { size: o.size ?? 7.6, anchor: "start", fill: o.fill ?? C.MUTE, mono: true, ls: .9, w: 600 });
  }

  const DEFS = `<defs>
  <pattern id="tile" width="8" height="15" patternUnits="userSpaceOnUse">
    <line x1="0" y1="14.5" x2="8" y2="14.5" stroke="rgba(20,30,45,.14)" stroke-width="1"/>
  </pattern>
  <pattern id="tilefine" width="6" height="6" patternUnits="userSpaceOnUse">
    <path d="M0,6 L6,0" stroke="rgba(20,30,45,.07)" stroke-width="1"/>
  </pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse">
    <path d="M0,1.2 L9,5 L0,8.8 z" fill="${C.WIRE}"/></marker>
  <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse">
    <path d="M0,1.2 L9,5 L0,8.8 z" fill="${C.CMT.s}"/></marker>
  <marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse">
    <path d="M0,1.2 L9,5 L0,8.8 z" fill="${C.HOT2}"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.6" markerHeight="5.6" orient="auto-start-reverse">
    <path d="M0,1.2 L9,5 L0,8.8 z" fill="${C.GRN}"/></marker>
</defs>`;

  /* wrap a completed buffer into a standalone svg */
  function svg(w, h, minw) {
    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"`
      + ` style="min-width:${minw ?? Math.min(w, 720)}px;max-width:100%;height:auto"`
      + ` font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif">`
      + `${DEFS}${S.join("\n")}</svg>`;
  }
