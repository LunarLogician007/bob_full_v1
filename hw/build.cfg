# -----------------------------------------------------------------------------
# hw/build.cfg - the one place a build is described
#
#   key = value      '#' starts a comment
#
# Any key can be overridden on the command line:
#   vivado -mode batch -source hw/scripts/build.tcl -tclargs build top=mini_fpga_top
# -----------------------------------------------------------------------------

# Which milestone this bundle belongs to. Outputs go to <project>/out/<tag>/.
tag         = M25

# Board top and its IDCODE (hex, no prefix). The version nibble (top 4 bits)
# names the build on the wire, so software/host/detect.sh and software/host/hwtest.py can tell
# which bitstream is actually in the PL. It changes only when the RTL does.
#   0x3BEEF093  M0-M1  fpga4x4_top (old 4-bit TAP)
#   0x4BEEF093  M2     cfg_test_top (configuration plane alone)
#   0x5BEEF093  M3     fpga4x4_top on the configuration plane (complete FPGA)
#   0x6BEEF093  M4     + user clock (sysclk H16), routed CE/SR, LUT K parameter
#   0x7BEEF093  M5     + BRAM tile (RAMB18, USER4 contents)
#   0x8BEEF093  M6     + DSP tile (2 cascaded DSP48E1-style slices)
#   0x9BEEF093  M7     bob_top 8x8 core (48 CLBs) - frozen in release/M7_8x8, not built yet
#   0xABEEF093  M7     bob_top 6x4 core (16 CLBs, 2 BRAMs, 2 DSPs, 20 pads, W=24 L4, fabric from
#                      VPR's rr graph) - the board build through M12
#   0xBBEEF093  M13    + frame configuration (UG470 packets on CFG_IN/CFG_OUT, chain kept on
#                      CHAIN_IN/CHAIN_OUT), timing fixes (gce gap, KEEP_HIERARCHY, TCK 100 kHz)
#   0xEBEEF093  M15    one build for M12b + M14 + M15 (C and D never built alone)
#   0xFBEEF093  M16    10x10 grid (100 CLBs) - the last free version nibble
# From M20 the version nibble is 0 and the 16-bit part field names the milestone in
# readable digits, 0B0<MM>: 0x0B020093 is M20, 0x0B021093 M21 (manufacturer bits 093 kept).
#   0x0B020093  M20    per-design user clock (clk_period / clk_gap), delay extraction
#   0x0B021093  M21    the cluster CLB (N elements behind a crossbar), BRAM-shadow readback
#   0x0B022093  M22    LUT contents and crossbar in CFGLUT5 (lut_loader.v), 9x9 CLBs
#   0x0B023093  M23    crossbar OR roots (lxor.v), routing muxes as LUT6/MUXF7/MUXF8, 10x10 CLBs
#   0x0B024093  M24    Double Duty elements: the adder on two bypass inputs beside a LUT (ble.sv dd)
#   0x0B025093  M25    time-travel debugging (UG470 GRESTORE), TCK constrained at 1 MHz
# From M3 on every build is the complete FPGA plus the new feature.
top         = bob_top
idcode      = 0B025093

# USERCODE (AMD instruction 001000) = milestone number, passed as the
# USERCODE_VALUE generic to tops that have it (jtag_tap6-based tops).
usercode    = 00000019

# JTAG instruction register width of this top: 4 (jtag_tap.v) or 6 (jtag_tap6.v).
# Read by software/host/hwtest.py; ignored by Vivado.
ir_width    = 6

part        = xc7z020clg400-1
xdc         = constr/pynq_z2.xdc

# Behavioural simulation in XSim (-tclargs sim). vectors.vh is generated on the
# Mac by sim/gen_vectors.py and travels inside hw/tb.
sim_top     = tb_bob
sim_files   = tb/tb_cfg.v tb/tb_bob.v tb/tb_mini_fpga.v tb/tb_bram.v tb/tb_dsp.v
sim_defines = SIMULATION

# Vivado project location, relative to hw/. The default puts it NEXT TO hw/,
# so pasting a new hw/ over the old one never touches the project.
project     = ../bob_vivado

jobs        = 4

# M20: after implementation, time the hops in scripts/delay_samples.txt and write
# out/<tag>/delay_paths.rpt (software/bob/delays.py fold turns it into delays.json).
# It only reads timing. 0 skips it.
delays      = 1

# Vivado synth_design -directive (M7). RuntimeOptimized: the generated fabric's
# combinational loops make the default timing-driven synthesis take very long, and
# every fabric path is already a 120-cycle multicycle. Empty = Vivado default.
synth_directive = RuntimeOptimized
