    txt(PX + 332, Y - 100, "one voltage per bank, not per pin — 50 pins share it",
      { size: 7, anchor: "start", mono: true, fill: C.MUTE });

    /* input path */
    wire([[PX + 26, Y - 10], [PX + 70, Y - 10]], { s: C.IO.s, sw: 1.4 });
    const inb = buf(PX + 70, Y - 26, 32, 32, { s: C.IO.s, f: C.IO.f });
    cap(PX + 86, Y + 16, "IBUF");
    const dly = 244;
    rect(dly, Y - 42, 90, 34, { f: C.IO.f, s: C.IO.s, sw: 1.1, rx: 3 });
    txt(dly + 45, Y - 26, "IODELAY", { size: 8.4, w: 660, fill: C.IO.t });
    txt(dly + 45, Y - 15, "31 taps, ~78 ps", { size: 6.4, mono: true, fill: C.MUTE });
    wire([[PX + 102, Y - 10], [dly, Y - 25]], { s: C.IO.s, sw: 1.4 });
    const iddr = 386;
    rect(iddr, Y - 52, 96, 54, { f: C.IO.f, s: C.IO.s, sw: 1.1, rx: 3 });
    txt(iddr + 48, Y - 32, "IDDR", { size: 8.6, w: 660, fill: C.IO.t });
    txt(iddr + 48, Y - 20, "ISERDES", { size: 8.6, w: 660, fill: C.IO.t });
    txt(iddr + 48, Y - 8, "1:2 … 1:8", { size: 6.4, mono: true, fill: C.MUTE });
    wire([[dly + 90, Y - 25], [iddr, Y - 25]], { s: C.IO.s, sw: 1.4 });
    bus(iddr + 96, Y - 25, 600, Y - 25, "n", { s: C.IO.s, marker: "ah" });
    txt(608, Y - 21, "→ FABRIC", { size: 8, anchor: "start", mono: true, w: 640, fill: C.IO.t });

    /* output path — flows right to left, fabric → ODDR → OBUF → pad */
    const obx = PX + 70, oby = Y + 30;
    path(`M${obx + 32},${oby} L${obx},${oby + 16} L${obx + 32},${oby + 32} Z`, { f: C.IO.f, s: C.IO.s, sw: 1.1 });
    wire([[obx, oby + 16], [PX + 44, oby + 16], [PX + 44, Y + 10], [PX + 26, Y + 10]], { s: C.IO.s, sw: 1.4, marker: "ah" });
    /* the tri-state enable is just another fabric signal */
    wire([[obx + 16, oby + 24], [obx + 16, Y + 108], [300, Y + 108]], { s: C.CFG.s, sw: 1.2, dash: "4 3" });
    const oddr = 386;
    rect(oddr, Y + 26, 96, 54, { f: C.IO.f, s: C.IO.s, sw: 1.1, rx: 3 });
    txt(oddr + 48, Y + 46, "ODDR", { size: 8.6, w: 660, fill: C.IO.t });
    txt(oddr + 48, Y + 58, "OSERDES", { size: 8.6, w: 660, fill: C.IO.t });
    txt(oddr + 48, Y + 70, "slew · drive strength", { size: 6.4, mono: true, fill: C.MUTE });
    bus(600, Y + 53, oddr + 96, Y + 53, "n", { s: C.IO.s, marker: "ah" });
    txt(608, Y + 57, "← FABRIC", { size: 8, anchor: "start", mono: true, w: 640, fill: C.IO.t });
    wire([[oddr, Y + 53], [252, Y + 53], [252, Y + 46], [obx + 32, Y + 46]], { s: C.IO.s, sw: 1.4, marker: "ah" });
    cap(obx + 32, Y + 72, "OBUF — tri-state", { anchor: "start" });
    txt(306, Y + 112, "T — output enable, also just a fabric signal", { size: 7.4, anchor: "start", mono: true, fill: C.MUTE });

    /* configuration options are just more SRAM cells */
    frame(660, Y - 84, 388, 176, "EVERY OPTION HERE IS CONFIGURATION BITS", { bg: "#fdfdfb" });
    [["direction", "in / out / bidirectional"],
     ["I/O standard", "LVCMOS33/25/18 · LVDS · SSTL"],
     ["drive strength", "4 / 8 / 12 / 16 / 24 mA"],
     ["slew rate", "FAST / SLOW"],
     ["pull", "UP / DOWN / KEEPER / NONE"],
     ["delay tap", "0 … 31"]].forEach(([a, b], i) => {
        const y = Y - 56 + i * 22;
        cell(680, y - 8, 12, 11, i % 2, { showv: false });
        txt(700, y, a, { size: 8.4, anchor: "start", w: 640, fill: C.IO.t });
        txt(816, y, b, { size: 7.6, anchor: "start", mono: true, fill: C.MUTE });
      });

    txt(0, 420, "The IOB is where a clean digital abstraction meets an analog world: impedance, simultaneous-switching noise,"
      + " and a bank voltage shared by fifty pins. It is also, in every FPGA project, where the first day of debugging goes.",
      { size: 8, anchor: "start", fill: C.MUTE });

    return svg(1064, 440, 880);
  };

  /* ============================================================================
     CONFIG CONTROLLER  —  the bitstream, byte by byte
     ========================================================================= */
  SCHEM.config = function () {
    S = [];
    hdr(0, 16, "THE BITSTREAM — a stream of register writes, not a memory image");

    /* the packet stream laid out as a tape */
    const TY = 60, TH = 62;
    const fields = [
      ["FF FF FF FF", "dummy pad", 92, "#f2f2ee"],
      ["AA 99 55 66", "SYNC WORD", 104, "#fdefe2"],
      ["type-1 write IDCODE", "device check", 140, C.CFG.f],
      ["type-1 write CMD", "WCFG", 100, C.CFG.f],
      ["type-1 write FAR", "first frame address", 140, C.CFG.f],
      ["type-2 write FDRI", "•••  the frames  •••", 190, "#dbe9f7"],
      ["CRC", "checksum", 74, C.CFG.f],
      ["CMD DGHIGH / START", "startup", 130, "#dbeee1"]
    ];
    let x = 8;
    fields.forEach(([n, d, w, f]) => {
      rect(x, TY, w, TH, { f, s: "#c2c8ce", sw: 1, rx: 3 });
      txt(x + w / 2, TY + 26, n, { size: 8.2, w: 660, mono: true });
      txt(x + w / 2, TY + 42, d, { size: 6.8, fill: C.MUTE, mono: true });
      x += w + 4;
    });
    line(8, TY + TH + 10, x - 4, TY + TH + 10, { s: "#c2c8ce", sw: 1 });
    txt(8, TY - 8, "SHIFTED IN MSB-FIRST, ONE BIT PER CCLK", { size: 6.8, anchor: "start", fill: C.FAINT, mono: true, ls: .8 });
    txt(x - 4, TY + TH + 24, "→ time", { size: 7, anchor: "end", fill: C.FAINT, mono: true });

    /* the packet header decoded */
    frame(8, 160, 512, 176, "TYPE-1 PACKET HEADER  ·  32 BITS", { bg: "#fdfdfb" });
    const hxs = [["001", "type", 56], ["01", "opcode = write", 96], ["00000001100", "register address", 132], ["00", "rsvd", 44], ["00000000001", "word count", 96]];
    let hx = 34;
    hxs.forEach(([b, d, w]) => {
      rect(hx, 190, w, 34, { f: "#f6f7f8", s: "#cdd5dd", sw: 1, rx: 3 });
      txt(hx + w / 2, 211, b, { size: 8, mono: true, w: 640 });
      txt(hx + w / 2, 238, d, { size: 6.8, mono: true, fill: C.MUTE });
      hx += w + 6;
    });
    [["FAR", "frame address register — row, column, minor"],
     ["FDRI", "frame data in — auto-increments FAR after each frame"],
     ["FDRO", "frame data out — the readback path"],
     ["CMD", "WCFG · START · DGHIGH · RCRC"]].forEach(([r, d], i) => {
        const y = 268 + i * 17;
        txt(34, y, r, { size: 8.4, anchor: "start", mono: true, w: 700, fill: C.CFG.t });
        txt(90, y, d, { size: 8, anchor: "start", fill: C.MUTE });
      });

    /* the controller FSM */
    frame(538, 160, 518, 176, "WHAT THE CONTROLLER DOES WITH IT", { bg: "#fdfdfb" });
    const fsm = ["hunt for SYNC", "decode packet header", "route payload to a register",
      "FDRI → frame shift register", "pulse the word line, FAR++", "verify CRC", "run the startup sequence"];
    fsm.forEach((s, i) => {
      const y = 186 + i * 21;
      rect(560, y, 24, 16, { f: C.CFG.f, s: C.CFG.s, sw: 1, rx: 3 });
      txt(572, y + 12, String(i + 1), { size: 8, mono: true, w: 700, fill: C.CFG.t });
      txt(596, y + 12, s, { size: 8.4, anchor: "start", fill: i === 4 ? C.INK : C.MUTE, w: i === 4 ? 620 : 400 });
      if (i < fsm.length - 1) line(572, y + 16, 572, y + 21, { s: "#c2c8ce", sw: 1 });
    });

    /* the security gate */
    frame(8, 356, 1048, 92, "THE CHECKS THAT STOP A BAD IMAGE", { bg: "#fdfdfb" });
    [["IDCODE", "wrong device → abort", C.CFG],
     ["AES-256 + HMAC", "wrong key or tampered → abort", C.CFG],
     ["CRC per packet", "corrupted stream → abort, INIT_B low", C.CFG],
     ["DONE stays low", "the fabric never leaves reset", C.BRAM]]
      .forEach(([n, d, k], i) => {
        const x2 = 32 + i * 256;
        rect(x2, 380, 236, 50, { f: k.f, s: k.s, sw: 1.1, rx: 5 });
        txt(x2 + 118, 400, n, { size: 9, w: 680, fill: k.t });
        txt(x2 + 118, 415, d, { size: 6.9, mono: true, fill: C.MUTE });
        if (i < 3) line(x2 + 240, 405, x2 + 252, 405, { s: "#8e8e86", sw: 1.2, marker: "ah" });
      });

    return svg(1064, 464, 900);
  };

  /* ============================================================================
     JTAG TAP  —  the 16-state machine, drawn properly
     ========================================================================= */
  SCHEM.jtag = function () {
    S = [];
    hdr(0, 16, "THE TAP CONTROLLER — sixteen states, one pin (TMS) driving all of them");

    const nodes = {
      TLR:  [532, 56, "Test-Logic-Reset"],
      RTI:  [532, 118, "Run-Test / Idle"],
      SDS:  [340, 118, "Select-DR"], SIS: [724, 118, "Select-IR"],
      CDR:  [340, 176, "Capture-DR"], CIR: [724, 176, "Capture-IR"],
      SDR:  [340, 234, "Shift-DR"],   SIR: [724, 234, "Shift-IR"],
      E1DR: [340, 292, "Exit1-DR"],   E1IR: [724, 292, "Exit1-IR"],
      PDR:  [180, 292, "Pause-DR"],   PIR: [884, 292, "Pause-IR"],
      E2DR: [180, 350, "Exit2-DR"],   E2IR: [884, 350, "Exit2-IR"],
      UDR:  [340, 408, "Update-DR"],  UIR: [724, 408, "Update-IR"]
    };
    const NW = 118, NH = 34;

    const edges = [
      ["TLR", "TLR", 1, "self"], ["TLR", "RTI", 0], ["RTI", "RTI", 0, "self"], ["RTI", "SDS", 1],
      ["SDS", "CDR", 0], ["SDS", "SIS", 1], ["SIS", "CIR", 0], ["SIS", "TLR", 1],
      ["CDR", "SDR", 0], ["CDR", "E1DR", 1], ["SDR", "SDR", 0, "self"], ["SDR", "E1DR", 1],
      ["E1DR", "PDR", 0], ["E1DR", "UDR", 1], ["PDR", "PDR", 0, "self"], ["PDR", "E2DR", 1],
      ["E2DR", "SDR", 0], ["E2DR", "UDR", 1], ["UDR", "RTI", 0], ["UDR", "SDS", 1],
      ["CIR", "SIR", 0], ["CIR", "E1IR", 1], ["SIR", "SIR", 0, "self"], ["SIR", "E1IR", 1],
      ["E1IR", "PIR", 0], ["E1IR", "UIR", 1], ["PIR", "PIR", 0, "self"], ["PIR", "E2IR", 1],
      ["E2IR", "SIR", 0], ["E2IR", "UIR", 1], ["UIR", "RTI", 0], ["UIR", "SDS", 1]
    ];

    /* three edges would otherwise run straight through another state box,
       so they get an explicit detour: [route, labelX, labelY] */
    const DETOUR = {
      /* Select-DR → Select-IR would run straight through Run-Test/Idle */
      "SDS|SIS": [[[399, 135], [436, 135], [436, 166], [628, 166], [628, 135], [665, 135]], 532, 166],
      /* both Update states return to Select-DR (not Select-IR) — long way round */
      "UDR|SDS": [[[281, 425], [104, 425], [104, 135], [281, 135]], 104, 280],
      "UIR|SDS": [[[724, 442], [724, 452], [88, 452], [88, 100], [340, 100], [340, 118]], 88, 300],
      /* Capture → Exit1 skips the Shift state sitting between them */
      "CDR|E1DR": [[[399, 193], [430, 193], [430, 309], [399, 309]], 430, 251],
      "CIR|E1IR": [[[665, 193], [634, 193], [634, 309], [665, 309]], 634, 251]
    };

    const ctr = k => [nodes[k][0], nodes[k][1] + NH / 2];
    edges.forEach(([a, b, tms, kind]) => {
      const col = tms ? C.HOT : "#9aa6b2", sw = tms ? 1.3 : 1.1;
      const det = DETOUR[a + "|" + b];
      if (det) {
        wire(det[0], { s: col, sw, marker: "ah" });
        rect(det[1] - 5, det[2] - 6, 10, 11, { f: "#fdfdfb", rx: 2 });
        txt(det[1], det[2] + 3, String(tms), { size: 7, mono: true, fill: col, w: 700 });
        return;
      }
      if (kind === "self") {
        const [x, y] = ctr(a);
        path(`M${x - NW / 2},${y - 8} C${x - NW / 2 - 34},${y - 26} ${x - NW / 2 - 34},${y + 26} ${x - NW / 2},${y + 8}`,
          { s: col, sw, marker: "ah" });
        txt(x - NW / 2 - 40, y + 3, String(tms), { size: 7, mono: true, fill: col, anchor: "end", w: 700 });
        return;
      }
      const [x1, y1] = ctr(a), [x2, y2] = ctr(b);
      let pts;
      if (Math.abs(x1 - x2) < 2) pts = [[x1, y1 + NH / 2], [x2, y2 - NH / 2]];
      else if (Math.abs(y1 - y2) < 2) pts = [[x1 + (x2 > x1 ? NW / 2 : -NW / 2), y1], [x2 + (x2 > x1 ? -NW / 2 : NW / 2), y2]];
      else {
        const mx = (x1 + x2) / 2;
        pts = [[x1 + (x2 > x1 ? NW / 2 : -NW / 2), y1], [mx, y1], [mx, y2], [x2 + (x2 > x1 ? -NW / 2 : NW / 2), y2]];
      }
      wire(pts, { s: col, sw, marker: "ah" });
      const lx = (pts[0][0] + pts[pts.length - 1][0]) / 2, ly = (pts[0][1] + pts[pts.length - 1][1]) / 2;
      rect(lx - 5, ly - 6, 10, 11, { f: "#fdfdfb", rx: 2 });
      txt(lx, ly + 3, String(tms), { size: 7, mono: true, fill: col, w: 700 });
    });

    Object.entries(nodes).forEach(([k, [x, y, label]]) => {
      const isShift = k === "SDR" || k === "SIR";
      const isReset = k === "TLR";
      const kk = isShift ? C.CFG : isReset ? C.HARD : C.BRD;
      rect(x - NW / 2, y, NW, NH, { f: kk.f, s: kk.s, sw: isShift ? 1.6 : 1.1, rx: 5 });
      txt(x, y + 21, label, { size: 8, w: isShift ? 700 : 560, fill: kk.t });
    });

    /* the practical point */
    frame(28, 476, 1028, 100, "WHY YOU CARE", { bg: "#fdfdfb" });
    txt(52, 504, "Everything the debugger does is a walk through this graph.", { size: 10.5, anchor: "start", w: 660 });
    ["Loading a bitstream, reading an ILA buffer, halting the soft CPU and single-stepping it are all the same operation:",
     "select a register, walk to Shift-DR, clock bits through TDI/TDO, walk to Update-DR. One pin — TMS — decides every",
     "branch. Orange edges are TMS = 1, grey are TMS = 0. Five TCKs with TMS held high always returns you to reset."]
      .forEach((s, i) => txt(52, 526 + i * 15, s, { size: 8.4, anchor: "start", fill: C.MUTE }));

    return svg(1064, 592, 920);
  };

  /* ============================================================================
     HROW  —  the clock-region band
     ========================================================================= */
  SCHEM.hrow = function () {
    S = [];
    hdr(0, 16, "HROW — where a global clock stops being global");

    const CY = 150;
    rect(40, CY - 26, 984, 52, { f: "#f0eaf8", s: C.CMT.s, sw: 1.2, rx: 5 });
    txt(60, CY + 4, "HROW", { size: 12, anchor: "start", w: 700, fill: C.CMT.t });
    txt(60, CY + 18, "12 global clocks", { size: 7, anchor: "start", mono: true, fill: C.MUTE });
    for (let i = 0; i < 12; i++) line(150, CY - 20 + i * 3.6, 1010, CY - 20 + i * 3.6, { s: "#b9a8d0", sw: .8 });

    /* the spine feeding it */
    wire([[532, 44], [532, CY - 26]], { s: C.CMT.s, sw: 2.4, marker: "ah" });
    txt(540, 52, "from the CMT spine", { size: 7.6, anchor: "start", mono: true, fill: C.CMT.t });

    /* BUFH per region half + the tiles below */
    for (let i = 0; i < 14; i++) {
      const x = 96 + i * 66;
      wire([[x, CY + 26], [x, CY + 52]], { s: "#b9a8d0", sw: 1.1 });
      buf(x - 9, CY + 52, 18, 18, { s: C.CMT.s, f: "#fff" });
      wire([[x, CY + 70], [x, CY + 84]], { s: "#b9a8d0", sw: 1.1 });
      const k = i % 5 === 2 ? C.BRAM : i % 7 === 4 ? C.DSP : C.CLB;
      rect(x - 22, CY + 84, 44, 116, { f: k.f, s: k.s, sw: .9, rx: 2 });
      rect(x - 22, CY + 84, 44, 116, { f: "url(#tile)", rx: 2 });
      txt(x, CY + 146, k === C.BRAM ? "BRAM" : k === C.DSP ? "DSP" : "CLB", { size: 7.2, rot: -90, fill: k.t, w: 620 });
      if (i === 0) cap(x, CY + 78, "BUFH");
    }
    cap(532, CY + 218, "one clock region — 50 CLBs tall in a 7-series part");

    frame(40, 390, 984, 118, "WHY THE REGION BOUNDARY IS A REAL CONSTRAINT", { bg: "#fdfdfb" });
    ["A clock region is the unit of clock distribution. Only 12 global clocks can enter one — so a design with more clock",
     "domains than that must be partitioned across regions, and the placer has to honour it. This is the origin of almost",
     "every clocking placement error a real toolchain reports, and it is the reason clock-region floorplanning exists.",
     "",
     "Build one balanced spine for v1. Regions and BUFH become interesting only once the array is large enough that a",
     "single H-tree can no longer meet skew across the die."]
      .forEach((s, i) => txt(64, 416 + i * 15, s, { size: 8.4, anchor: "start", fill: C.MUTE }));

    return svg(1064, 528, 880);
  };
  /* ============================================================================
     BLOCK-DIAGRAM RENDERER  —  the row/flow layout used by pages without a schematic
     ========================================================================= */
  const DW = 1040;
  function wrapTxt(s, maxc) {
    const w = String(s).split(" "), out = []; let cur = "";
    w.forEach(t => { if ((cur + " " + t).trim().length <= maxc) cur = (cur + " " + t).trim(); else { out.push(cur); cur = t; } });
    if (cur) out.push(cur);
    return out.slice(0, 2);
  }

  function renderRows(d) {
    S = [];
    let y = 14;
    const rows = d.rows || [];
    rows.forEach((row, ri) => {
      if (row.label) {
        txt(2, y + 7, row.label.toUpperCase(), { size: 7.4, anchor: "start", fill: C.FAINT, mono: true, ls: .9 });
        y += 16;
      }
      const items = row.items.filter(Boolean);
      const n = items.length, gap = row.t === "flow" ? 26 : 10;
      const bw = (DW - gap * (n - 1)) / n, bh = 54;
      items.forEach(([name, cap2, drill, kind], i) => {
        const x = i * (bw + gap), k = C[kind || d.k] || C.CLB;
        rect(x, y, bw, bh, {
          f: k.f, s: k.s, sw: drill ? 1.6 : 1, rx: 4,
          dash: kind === "SOFTK" ? "5 3" : null, cls: drill ? "dm" : null
        });
        const nl = wrapTxt(name, Math.max(10, Math.floor(bw / 6.1)));
        const capl = cap2 ? wrapTxt(cap2, Math.max(12, Math.floor(bw / 4.3))) : [];
        let ty = bh / 2 - (nl.length - 1) * 5.5 - capl.length * 4.6 + 3;
        nl.forEach(l => { txt(x + bw / 2, y + ty, l, { size: 9.2, w: 640, fill: k.t }); ty += 11; });
        capl.forEach(l => { txt(x + bw / 2, y + ty + 1, l, { size: 6.9, fill: C.MUTE, mono: true }); ty += 9; });
        if (drill) {
          txt(x + bw - 7, y + 12, "▸", { size: 9, anchor: "end", fill: C.HOT, w: 700 });
          S.push(`<rect class="hit" data-id="${drill}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="transparent" pointer-events="all"/>`);
        }
        if (row.t === "flow" && i < n - 1)
          line(x + bw + 3, y + bh / 2, x + bw + gap - 3, y + bh / 2, { s: "#8e8e86", sw: 1.3, marker: "ah" });
      });
      y += bh;
      if (ri < rows.length - 1) { line(DW / 2, y, DW / 2, y + 14, { s: "#cbcbc3", sw: 1.2 }); y += 14; }
    });
    return svg(DW, y + 8, Math.min(DW, 760));
  }

  /* ============================================================================
     NAVIGATION
     ========================================================================= */
  const ov = document.getElementById("ov");
  const $ = id => document.getElementById(id);
  let stack = [];

  function openPage(id) {
    if (!DET[id]) return;
    if (stack[stack.length - 1] !== id) stack.push(id);
    paint();
  }

  /* redraw only the live schematic — used by the demo controls */
  function redrawSchem(id) {
    if (SCHEM[id]) $("dschem").innerHTML = SCHEM[id]();
  }

  /* a running animation must never outlive the page that owns it, or it would
     keep repainting #dschem after the user has navigated somewhere else */
  function stopAnimations() {
    if (CARRY.timer) { clearInterval(CARRY.timer); CARRY.timer = null; }
  }

  function paint() {
    stopAnimations();
    const id = stack[stack.length - 1], d = DET[id], k = C[d.k] || C.CLB;

    $("dsw").style.background = k.s;
    $("dtitle").textContent = d.title;
    $("dsub").textContent = d.sub || "";

    /* schematic + live controls */
    const sw = $("dschemw");
    if (SCHEM[id]) {
      sw.style.display = "";
      redrawSchem(id);
      const dem = $("ddemo");
      if (DEMO[id]) { dem.innerHTML = DEMO[id].html; DEMO[id].wire(() => redrawSchem(id)); }
      else dem.innerHTML = "";
    } else { sw.style.display = "none"; $("ddemo").innerHTML = ""; }

    /* block diagram */
    const rw = $("drowsw");
    if (d.rows && d.rows.length) {
      rw.style.display = "";
      $("drowshdr").textContent = SCHEM[id] ? "The same block, as a signal flow" : "Block diagram";
      $("ddiag").innerHTML = renderRows(d);
    } else rw.style.display = "none";

    /* breadcrumb */
    const cr = $("dcrumb");
    cr.innerHTML = stack.map((s, i) =>
      i === stack.length - 1
        ? `<span style="color:#35353c">${esc(DET[s].title.split(" — ")[0])}</span>`
        : `<button data-i="${i}">${esc(DET[s].title.split(" — ")[0])}</button><span>›</span>`
    ).join(" ") + (stack.length > 1 ? `<span style="margin-left:auto;color:#b6b6ae">⌫ back · Esc close</span>` : "");
    cr.querySelectorAll("button").forEach(b => b.onclick = () => { stack = stack.slice(0, +b.dataset.i + 1); paint(); });

    /* notes */
    const nw = $("dnotesw");
    if (d.notes && d.notes.length) {
      nw.style.display = "";
      $("dnotes").innerHTML = d.notes.map(n => `<li>${n}</li>`).join("");
    } else nw.style.display = "none";

    /* sub-blocks */
    const dw = $("ddrillw");
    const dr = (d.drill || []).filter(x => DET[x]);
    if (dr.length) {
      dw.style.display = "";
      $("ddrill").innerHTML = dr.map(x =>
        `<button data-go="${x}">${esc(DET[x].title.split(" — ")[0])} ▸</button>`).join("");
      $("ddrill").querySelectorAll("button").forEach(b => b.onclick = () => openPage(b.dataset.go));
    } else dw.style.display = "none";

    $("dlnk").innerHTML = d.stage
      ? `Full detail, papers, repos and pitfalls: <a href="${d.stage}/README.md">${d.stage}/README.md</a>`
      : "";

    ov.classList.add("on");
    ov.scrollTop = 0;
  }

  function closeOv() { stopAnimations(); ov.classList.remove("on"); stack = []; }

  $("out").addEventListener("click", e => {
    const t = e.target.closest("[data-id]"); if (t) openPage(t.dataset.id);
  });
  ["ddiag", "dschem"].forEach(el => $(el).addEventListener("click", e => {
    const t = e.target.closest("[data-id]"); if (t) openPage(t.dataset.id);
  }));
  $("dx").onclick = closeOv;
  ov.addEventListener("click", e => { if (e.target === ov) closeOv(); });
  addEventListener("keydown", e => {
    if (!ov.classList.contains("on")) return;
    if (e.key === "Escape") closeOv();
    if ((e.key === "Backspace" || e.key === "ArrowLeft") && stack.length > 1) { e.preventDefault(); stack.pop(); paint(); }
  });

  /* ── dev sanity check: every hotspot must land on a page ── */
  (function audit() {
    const ids = [...document.querySelectorAll("#out [data-id]")].map(n => n.dataset.id);
    const missing = [...new Set(ids)].filter(i => !DET[i]);
    if (missing.length) console.warn("hotspots with no detail page:", missing);
    const bad = [];
    Object.entries(DET).forEach(([k, d]) => {
      (d.drill || []).forEach(x => { if (!DET[x]) bad.push(k + " → " + x); });
      (d.rows || []).forEach(r => r.items.filter(Boolean).forEach(it => {
        if (it[2] && !DET[it[2]]) bad.push(k + " row → " + it[2]);
      }));
    });
    if (bad.length) console.warn("dangling drill links:", bad);
    const noSchem = Object.keys(SCHEM).filter(k => !DET[k]);
    if (noSchem.length) console.warn("schematics with no page:", noSchem);
    console.log("pages:", Object.keys(DET).length, "| schematics:", Object.keys(SCHEM).length,
      "| live demos:", Object.keys(DEMO).length, "| hotspots:", ids.length);
  })();
</script>
