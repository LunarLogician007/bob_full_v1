<title>FPGA Architecture — Interactive Die Floorplan &amp; Schematics</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @page { size: A3 landscape; margin: 8mm }

  :root {
    --ink: #17171a;
    --ink-2: #4a4a52;
    --mute: #74747e;
    --faint: #9a9aa4;
    --rule: #e4e4dd;
    --rule-2: #f0efe9;
    --paper: #ffffff;
    --desk: #b9b7b0;
    --accent: #b8500f;
    --accent-2: #d97a28;
    --accent-bg: #fdf6ef;
    --shadow: 0 1px 2px rgba(20,20,25,.05), 0 8px 30px rgba(20,20,25,.13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }

  * { box-sizing: border-box }

  html, body {
    margin: 0; padding: 0;
    background: var(--desk);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ───────────────────────── top bar ───────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 14px; align-items: center;
    padding: 0 18px; height: 46px;
    background: #1e1e22;
    color: #eceae4;
    font-size: 13px;
    border-bottom: 1px solid #000;
  }
  .bar .brand { font-weight: 620; letter-spacing: -.015em; font-size: 13.5px }
  .bar .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); flex: none }
  .bar .tip {
    font-family: var(--mono); font-size: 11px; color: #c9a071;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .bar .sp { flex: 1 }
  .bar .meta { font-family: var(--mono); font-size: 10.5px; color: #85858e; letter-spacing: .03em }
  .bar button {
    background: #303036; color: #eceae4;
    border: 1px solid #46464e; border-radius: 6px;
    padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .bar button:hover { background: #3c3c44; border-color: #63636e }

  /* ───────────────────────── sheet ───────────────────────── */
  .sheet {
    background: var(--paper);
    margin: 18px auto 26px;
    max-width: 1700px;
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto }

  .hit { cursor: pointer; fill: rgba(0,0,0,0); transition: fill .1s }
  .hit:hover { fill: rgba(217,122,40,.20); stroke: var(--accent); stroke-width: 1.6 }

  /* ───────────────────────── overlay card ───────────────────────── */
  .ov {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(16,16,19,.60);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 32px 20px 60px; overflow-y: auto;
  }
  .ov.on { display: flex }

  .card {
    background: var(--paper); border-radius: 14px;
    max-width: 1140px; width: 100%;
    box-shadow: 0 24px 70px rgba(0,0,0,.40);
    overflow: hidden;
    animation: rise .16s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  .chead {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 24px 16px; border-bottom: 1px solid var(--rule);
  }
  .chead .sw { width: 4px; height: 38px; border-radius: 2px; flex: none; margin-top: 3px }
  .chead h2 { margin: 0; font-size: 20px; letter-spacing: -.022em; font-weight: 640; line-height: 1.2 }
  .chead p { margin: 4px 0 0; font-size: 12px; color: var(--mute); font-family: var(--mono); letter-spacing: .01em }
  .chead .x {
    margin-left: auto; background: #f4f3ef; border: 1px solid var(--rule);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer;
    font-size: 14px; color: var(--ink-2); flex: none; line-height: 1;
  }
  .chead .x:hover { background: #eae9e3 }

  .crumb {
    padding: 9px 24px; background: #fbfaf7; border-bottom: 1px solid var(--rule-2);
    font-size: 11px; font-family: var(--mono); color: var(--faint);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .crumb button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0 }
  .crumb button:hover { text-decoration: underline }

  .cbody { padding: 20px 24px 26px }

  .dsvg {
    border: 1px solid var(--rule); border-radius: 10px;
    background: #fdfdfb; padding: 14px; overflow-x: auto;
  }
  .dsvg + .dsvg { margin-top: 12px }

  .sect {
    font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--faint);
    margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-2);
  }

  .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px }
  .notes li { font-size: 13.5px; line-height: 1.5; color: #35353c; padding-left: 17px; position: relative; max-width: 92ch }
  .notes li:before {
    content: ''; position: absolute; left: 0; top: .60em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
  }
  .notes b { color: var(--ink); font-weight: 620 }
  .notes code { font-family: var(--mono); font-size: 12px; background: #f4f3ef; padding: 1px 5px; border-radius: 4px }

  .chips { display: flex; gap: 8px; flex-wrap: wrap }
  .chips button {
    background: #fff; border: 1px solid #dddcd4; border-radius: 20px;
    padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; color: #3a3a42;
    transition: all .12s;
  }
  .chips button:hover { border-color: var(--accent-2); color: var(--accent); background: var(--accent-bg) }

  .lnk { margin-top: 20px; font-size: 12.5px; color: var(--mute) }
  .lnk a { color: var(--accent) }

  .dm { transition: fill .1s }
  .drillmark { cursor: pointer }

  /* ───────────────────────── live demo controls ───────────────────────── */
  .demo {
    margin-top: 12px; border: 1px solid var(--rule); border-radius: 10px;
    background: #fbfaf7; padding: 13px 15px;
  }
  .demo h4 {
    margin: 0 0 11px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint); font-weight: 500;
  }
  .demo h4 span { color: var(--accent); }
  .ctl { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
  .ctl .grp { display: flex; gap: 6px; align-items: center }
  .ctl label { font-family: var(--mono); font-size: 11px; color: var(--mute) }

  .sw6 {
    width: 34px; height: 30px; border-radius: 7px; cursor: pointer;
    border: 1px solid #d5d4cc; background: #fff; color: var(--faint);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.05; padding: 0; transition: all .12s;
  }
  .sw6 .n { font-size: 8px; letter-spacing: .04em; color: var(--faint) }
  .sw6.on { background: var(--accent); border-color: var(--accent); color: #fff }
  .sw6.on .n { color: rgba(255,255,255,.72) }
  .sw6:hover { border-color: var(--accent-2) }

  .demo select, .demo input[type=text] {
    font: inherit; font-family: var(--mono); font-size: 12px;
    padding: 5px 9px; border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; color: var(--ink);
  }
  .demo button.act {
    font: inherit; font-size: 12px; padding: 6px 12px;
    border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; cursor: pointer; color: #3a3a42;
  }
  .demo button.act:hover { border-color: var(--accent-2); color: var(--accent) }

  .led {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    padding: 6px 13px; border-radius: 7px; border: 1px solid;
    background: #f2f1ec; border-color: #ddddd4; color: var(--faint);
  }
  .led.hi { background: #1f7a44; border-color: #176034; color: #fff }

  .hexout { font-family: var(--mono); font-size: 11.5px; color: var(--mute) }
  .hexout b { color: var(--ink); font-weight: 600 }

  /* ───────────────────────── print ───────────────────────── */
  @media print {
    html, body { background: #fff }
    .bar, .ov { display: none !important }
    .sheet { margin: 0; max-width: none; box-shadow: none; border-radius: 0 }
    .hit { display: none }
  }
</style>

<div class="bar">
  <span class="dot"></span>
  <span class="brand">FPGA Top-Level Architecture</span>
  <span class="tip">▸ click any block to open it</span>
  <span class="sp"></span>
  <span class="meta">A3 landscape · ⌘P → Save as PDF</span>
  <button onclick="print()">Print / PDF</button>
</div>

<div class="sheet"><div id="out"></div></div>

<div class="ov" id="ov">
  <div class="card">
    <div class="chead">
      <div class="sw" id="dsw"></div>
      <div>
        <h2 id="dtitle"></h2>
        <p id="dsub"></p>
      </div>
      <button class="x" id="dx" title="close (Esc)">✕</button>
    </div>
    <div class="crumb" id="dcrumb"></div>
    <div class="cbody">
      <div id="dschemw"><div class="dsvg" id="dschem"></div><div id="ddemo"></div></div>
      <div id="drowsw"><div class="sect" id="drowshdr">Block diagram</div><div class="dsvg" id="ddiag"></div></div>
      <div id="dnotesw">
        <div class="sect">Key points</div>
        <ul class="notes" id="dnotes"></ul>
      </div>
      <div id="ddrillw">
        <div class="sect">Open a sub-block</div>
        <div class="chips" id="ddrill"></div>
      </div>
      <div class="lnk" id="dlnk"></div>
    </div>
  </div>
</div>

<script>
  "use strict";
  /* ============================================================================
     PALETTE  —  each family:  f = fill, s = stroke, t = text
     ========================================================================= */
  const C = {
    CLB:  { f: "#dce8f7", s: "#3f76ad", t: "#1d4b78" },
    BRAM: { f: "#d7ecdc", s: "#3d8a58", t: "#1f5c38" },
    DSP:  { f: "#f9e7c8", s: "#b3801f", t: "#78530f" },
    CMT:  { f: "#e6dcf3", s: "#7a58ab", t: "#4d3273" },
    IO:   { f: "#eae5db", s: "#8c8271", t: "#544d3f" },
    CFG:  { f: "#f8dbd3", s: "#bb5340", t: "#8a3423" },
    GTX:  { f: "#d6eaed", s: "#3a8189", t: "#215257" },
    HARD: { f: "#e0e5ea", s: "#68757f", t: "#39434b" },
    BRD:  { f: "#f2f1ec", s: "#7d7669", t: "#3a352c" },
    SOFT: { s: "#c05a12", t: "#8f4108", f: "rgba(192,90,18,.05)" },
    DIE:  { s: "#26262a" },
    INK: "#17171a", MUTE: "#74747e", FAINT: "#9a9aa4",
    LINE: "#b9b9b2", RULE: "#e4e4dd",
    WIRE: "#5c5c64", HOT: "#d97a28", HOT2: "#b8500f", GRN: "#1f7a44"
  };
  const MONO = "ui-monospace,'SF Mono',Menlo,Consolas,monospace";
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ============================================================================
     PRIMITIVES  —  every helper pushes markup into the current buffer S
     ========================================================================= */
  let S = [];

  function rect(x, y, w, h, o = {}) {
    S.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 2}"`
      + ` fill="${o.f ?? "none"}" stroke="${o.s ?? "none"}" stroke-width="${o.sw ?? 1}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.cls ? ` class="${o.cls}"` : "")
      + (o.op ? ` opacity="${o.op}"` : "") + "/>");
  }

  function txt(x, y, s, o = {}) {
    const rot = o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : "";
    S.push(`<text x="${x}" y="${y}"${rot} font-size="${o.size ?? 9}"`
      + ` fill="${o.fill ?? C.INK}" text-anchor="${o.anchor ?? "middle"}"`
      + ` font-weight="${o.w ?? 400}" font-family="${o.mono ? MONO : "inherit"}"`
      + ` letter-spacing="${o.ls ?? 0}"`
      + (o.op ? ` opacity="${o.op}"` : "") + `>${esc(s)}</text>`);
  }

  function line(x1, y1, x2, y2, o = {}) {
    S.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s ?? C.LINE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function path(d, o = {}) {
    S.push(`<path d="${d}" fill="${o.f ?? "none"}" stroke="${o.s ?? C.WIRE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linejoin="round" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function block(x, y, w, h, name, cap, k, o = {}) {
    rect(x, y, w, h, { f: k.f, s: k.s, sw: o.sw ?? 1.1, rx: o.rx ?? 3 });
    const cy = y + h / 2;
    if (cap) {
      txt(x + w / 2, cy - 1, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
      txt(x + w / 2, cy + 10, cap, { size: o.cs ?? 7.2, fill: C.MUTE, mono: true });
    } else {
      txt(x + w / 2, cy + 3.4, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
    }
  }

  /* transparent click target — always emitted last so it sits above the art.
     fill is a presentation attribute so the markup survives a CSS-less export. */
  function hit(id, x, y, w, h, rx) {
    S.push(`<rect class="hit" data-id="${id}" x="${x}" y="${y}" width="${w}" height="${h}"`
      + ` rx="${rx ?? 3}" fill="transparent" pointer-events="all"/>`);
  }

  /* ============================================================================
     SCHEMATIC TOOLKIT  —  real symbols, not labelled rectangles
     ========================================================================= */

  /* wire through a list of [x,y] points, orthogonal as drawn */
  function wire(pts, o = {}) {
    path("M" + pts.map(p => p.join(",")).join(" L"),
      { s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, dash: o.dash, marker: o.marker, cap: "round" });
  }

  /* junction dot */
  function dot(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.1}" fill="${o.s ?? C.WIRE}"/>`);
  }

  /* open pin circle (port boundary) */
  function port(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.6}" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
  }

  /* multiplexer — the classic tapered trapezoid.
     dir "r" = inputs on the left, output right.  sel drawn on the bottom edge. */
  function mux(x, y, w, h, o = {}) {
    const t = o.taper ?? Math.min(h * 0.22, 9);
    path(`M${x},${y} L${x + w},${y + t} L${x + w},${y + h - t} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.label) txt(x + w / 2 + 1, y + h / 2 + (o.lo ?? 3), o.label,
      { size: o.ls2 ?? 7.4, fill: o.lf ?? C.MUTE, mono: true, w: 600 });
    return { in: i => [x, y + h * i], out: [x + w, y + h / 2], sel: [x + w / 2, y + h] };
  }

  /* flip-flop / register — box with the clock wedge on the lower-left */
  function ff(x, y, w, h, o = {}) {
    rect(x, y, w, h, { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, rx: 1.5 });
    path(`M${x},${y + h - 11} L${x + 8},${y + h - 6.5} L${x},${y + h - 2}`,
      { s: o.s ?? C.WIRE, sw: 1.1 });
    if (o.label) txt(x + w / 2 + 3, y + h / 2 - 1, o.label, { size: o.ls2 ?? 7.6, fill: o.lf ?? C.INK, w: 620 });
    if (o.sub) txt(x + w / 2 + 3, y + h / 2 + 8.5, o.sub, { size: 6.2, fill: C.FAINT, mono: true });
    return { d: [x, y + 10], clk: [x, y + h - 6.5], q: [x + w, y + h / 2] };
  }

  /* buffer / inverter triangle pointing right */
  function buf(x, y, w, h, o = {}) {
    path(`M${x},${y} L${x + w},${y + h / 2} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
    return { in: [x, y + h / 2], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* AND / OR / XOR gate bodies (IEEE distinctive shapes) */
  function gate(kind, x, y, w, h, o = {}) {
    const s = o.s ?? C.WIRE, f = o.f ?? "#fff", sw = o.sw ?? 1.1;
    if (kind === "and") {
      path(`M${x},${y} L${x + w * .45},${y} A${w * .55},${h / 2} 0 0 1 ${x + w * .45},${y + h} L${x},${y + h} Z`, { f, s, sw });
    } else {
      const back = kind === "xor" ? 5 : 0;
      path(`M${x + back},${y} Q${x + back + w * .55},${y + h * .06} ${x + w},${y + h / 2}`
        + ` Q${x + back + w * .55},${y + h * .94} ${x + back},${y + h}`
        + ` Q${x + back + w * .22},${y + h / 2} ${x + back},${y} Z`, { f, s, sw });
      if (kind === "xor") path(`M${x},${y} Q${x + w * .22},${y + h / 2} ${x},${y + h}`, { s, sw });
    }
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${s}" stroke-width="${sw}"/>`);
    if (o.label) txt(x + w * .42, y + h / 2 + 2.6, o.label, { size: 6.4, fill: C.FAINT, mono: true });
    return { a: [x, y + h * .28], b: [x, y + h * .72], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* NMOS pass transistor — the thing a routing PIP and a LUT mux leg really are.
     `flip` puts the gate on the right, so a mirrored pair never crosses its own leads. */
  function nmos(x, y, o = {}) {
    const s = o.s ?? C.WIRE, h = o.h ?? 16, w = 7, d = o.flip ? 1 : -1;
    line(x, y, x, y + h, { s, sw: 1.3 });                              // channel
    line(x + d * w, y + 2, x + d * w, y + h - 2, { s, sw: 1.1 });       // gate plate
    line(x + d * w, y + h / 2, x + d * 14, y + h / 2, { s, sw: 1 });    // gate lead
    return { g: [x + d * 14, y + h / 2], s1: [x, y], s2: [x, y + h] };
  }

  /* the same device rotated for a left-to-right signal, as in an SRAM access
     transistor. The two leads jog perpendicular into the channel bar — without that
     jog the bar is collinear with the wire and the symbol reads as a capacitor.
     `y` is the level of the signal wire; the gate lead runs up to `gateTo`. */
  function nmosH(x, y, o = {}) {
    const s = o.s ?? C.WIRE, w = o.w ?? 28;
    const ch = y - 8, plate = y - 15, gy = o.gateTo ?? y - 34;
    line(x, y, x, ch, { s, sw: 1.1 });                           // left lead
    line(x + w, y, x + w, ch, { s, sw: 1.1 });                   // right lead
    line(x, ch, x + w, ch, { s, sw: 1.4 });                      // channel bar
    line(x + 3, plate, x + w - 3, plate, { s, sw: 1.4 });        // gate plate
    line(x + w / 2, plate, x + w / 2, gy, { s, sw: 1 });         // gate lead
    return { g: [x + w / 2, gy], t1: [x, y], t2: [x + w, y] };
  }

  /* a single SRAM configuration cell, drawn as a small square.
     v = 0/1 fills it; hot = highlight as the selected cell */
  function cell(x, y, w, h, v, o = {}) {
    const on = !!v;
    rect(x, y, w, h, {
      f: o.hot ? C.HOT : (on ? (o.onf ?? "#3f76ad") : (o.off ?? "#eef1f4")),
      s: o.hot ? C.HOT2 : (o.s ?? "#b6c2ce"), sw: o.hot ? 1.3 : .6, rx: 1
    });
    if (o.showv && h >= 8) txt(x + w / 2, y + h / 2 + 2.6, on ? "1" : "0",
      { size: 6, mono: true, fill: o.hot ? "#fff" : (on ? "#fff" : C.FAINT), w: 700 });
  }

  /* bus with a slash and a width label — standard schematic notation */
  function bus(x1, y1, x2, y2, n, o = {}) {
    line(x1, y1, x2, y2, { s: o.s ?? C.WIRE, sw: o.sw ?? 1.6, marker: o.marker });
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    line(mx - 3.5, my + 4, mx + 3.5, my - 4, { s: o.s ?? C.WIRE, sw: 1 });
    if (n) txt(mx + (o.dx ?? 6), my - (o.dy ?? 6), n, { size: 6.4, fill: o.nf ?? C.MUTE, mono: true, anchor: o.anchor ?? "start" });
  }

  /* dashed enclosure with a corner caption — "this whole region is one X" */
  function frame(x, y, w, h, label, o = {}) {
    rect(x, y, w, h, { s: o.s ?? C.LINE, sw: o.sw ?? 1, dash: o.dash ?? "5 4", rx: o.rx ?? 5, f: o.f ?? "none" });
    if (label) {
      const lw = label.length * 4.4 + 10;

  /* ============================================================================
     LUT6  —  live 64:1 multiplexer
     ========================================================================= */
  const popc = n => { let c = 0; while (n) { c += n & 1; n >>= 1; } return c; };

  const LUTFN = {
    xor:  { name: "6-input XOR (parity)", eq: "O6 = A1 ⊕ A2 ⊕ A3 ⊕ A4 ⊕ A5 ⊕ A6", f: i => popc(i) & 1 },
    and:  { name: "6-input AND", eq: "O6 = A1 · A2 · A3 · A4 · A5 · A6", f: i => (i === 63 ? 1 : 0) },
    or:   { name: "6-input OR", eq: "O6 = A1 + A2 + A3 + A4 + A5 + A6", f: i => (i === 0 ? 0 : 1) },
    maj:  { name: "majority vote", eq: "O6 = 1 when four or more inputs are high", f: i => (popc(i) >= 4 ? 1 : 0) },
    mux:  { name: "2:1 multiplexer", eq: "O6 = A6 ? A2 : A1", f: i => ((i >> 5) & 1 ? (i >> 1) & 1 : i & 1) },
    mix:  { name: "mixed logic", eq: "O6 = (A1 · A2) + (A3 ⊕ A4)", f: i => (((i & 1) && ((i >> 1) & 1)) || (((i >> 2) & 1) ^ ((i >> 3) & 1))) ? 1 : 0 },
    rand: { name: "random truth table", eq: "no structure at all — the LUT does not care", f: () => (Math.random() < .5 ? 1 : 0) }
  };

  function lutLoad(k) {
    LUT.fn = k;
    const f = LUTFN[k].f;
    for (let i = 0; i < 64; i++) LUT.init[i] = f(i);
  }
  lutLoad("xor");

  /* INIT[63:0] as 16 hex digits, MSD first */
  function lutHex() {
    let s = "";
    for (let d = 15; d >= 0; d--) {
      let v = 0;
      for (let b = 0; b < 4; b++) v |= LUT.init[d * 4 + b] << b;
      s += v.toString(16).toUpperCase();
    }
    return s;
  }

  SCHEM.lut6 = function () {
    S = [];
    const CX = 78, CW = 27, CH = 5.4, P = 6.2, Y0 = 48;   // config-cell column
    const idx = lutIdx();
    const cellY = i => Y0 + i * P;
    const nodeC = [];                                      // nodeC[s][j] = centre y
    nodeC[0] = Array.from({ length: 64 }, (_, i) => cellY(i) + CH / 2);
    for (let s = 1; s <= 6; s++)
      nodeC[s] = Array.from({ length: 64 >> s }, (_, j) => (nodeC[s - 1][2 * j] + nodeC[s - 1][2 * j + 1]) / 2);

    const ST = [
      { x: 132, w: 14, h: 11 }, { x: 186, w: 15, h: 13 }, { x: 244, w: 16, h: 17 },

    const stRight = s => ST[s - 1].x + ST[s - 1].w;
    const outX = s => (s === 0 ? CX + CW : stRight(s));
    const RAIL_Y = 470;

    hdr(0, 16, "LUT6 — one 64:1 multiplexer, six select lines, sixty-four memory bits");
    txt(1058, 16, "▸ THE ORANGE PATH IS THE ONE ACTIVE ROUTE", { size: 7, anchor: "end", fill: C.HOT2, mono: true, w: 600, ls: .5 });

    /* select rails first, so the mux bodies overdraw them */
    for (let s = 1; s <= 6; s++) {
      const st = ST[s - 1], rx = st.x + st.w / 2, on = LUT.a[s - 1];
      line(rx, Y0 - 6, rx, RAIL_Y - 14, { s: on ? C.HOT : "#d2d6da", sw: on ? 1.6 : 1 });

      val(rx, RAIL_Y + 15, on);
      cap(rx, RAIL_Y + 32, "sel");
    }

    /* wires: every stage, dim first then the live one on top */
    const live = [];
    for (let s = 1; s <= 6; s++) {
      const st = ST[s - 1];
      for (let j = 0; j < (64 >> s); j++) {
        const my = nodeC[s][j] - st.h / 2;
        for (let k = 0; k < 2; k++) {
          const src = 2 * j + k, sy = nodeC[s - 1][src], sx = outX(s - 1);
          const dy = my + st.h * (k ? .74 : .26), dx = st.x;
          const mx = sx + (dx - sx) * .55;
          const pts = [[sx, sy], [mx, sy], [mx, dy], [dx, dy]];
          const isLive = (idx >> (s - 1)) === src;
          if (isLive) live.push(pts); else wire(pts, { s: "#ccd3d9", sw: .55 });
        }
      }
    }
    live.forEach(p => wire(p, { s: C.HOT, sw: 2 }));

    /* the 64 configuration cells */
    for (let i = 0; i < 64; i++) {
      cell(CX, cellY(i), CW, CH, LUT.init[i], { hot: i === idx });
      if (i % 8 === 0) txt(CX - 7, cellY(i) + CH, String(i), { size: 5.6, anchor: "end", fill: C.FAINT, mono: true });
    }
    rect(CX, Y0, CW, 64 * P - (P - CH), { s: "#9aa6b2", sw: 1, rx: 2 });
    txt(CX + CW / 2, Y0 - 9, "64 SRAM", { size: 6.6, mono: true, fill: C.MUTE, w: 600 });
    txt(CX + CW / 2, Y0 - 1.5, "CELLS", { size: 6.6, mono: true, fill: C.MUTE, w: 600 });

    /* half brackets — cells 0-31 feed the O5 tap */
    [[0, 31, "CELLS 0–31  → O5"], [32, 63, "CELLS 32–63"]].forEach(([a, b, lbl]) => {
      const y1 = cellY(a), y2 = cellY(b) + CH, bx = 62;
      path(`M${bx + 5},${y1} L${bx},${y1} L${bx},${y2} L${bx + 5},${y2}`, { s: "#c2c8ce", sw: 1 });
      txt(bx - 6, (y1 + y2) / 2, lbl, { size: 6.2, mono: true, fill: C.FAINT, rot: -90, ls: .4 });
    });

    /* mux bodies */
    for (let s = 1; s <= 6; s++) {
      const st = ST[s - 1];
      for (let j = 0; j < (64 >> s); j++) {
        const my = nodeC[s][j] - st.h / 2, on = (idx >> s) === j;
        mux(st.x, my, st.w, st.h, {
          f: on ? "#fdf0e4" : "#fff", s: on ? C.HOT2 : "#a8b0b8", sw: on ? 1.4 : .8,
          label: st.h >= 16 ? "2:1" : null, ls2: 6, lf: on ? C.HOT2 : C.FAINT
        });
        if (on) dot(st.x + st.w / 2, my + st.h, { r: 2, s: C.HOT2 });
      }
      cap(st.x + st.w / 2, Y0 - 20, (64 >> s) + "×");
      cap(st.x + st.w / 2, Y0 - 12, (64 >> (s - 1)) + ":" + (64 >> s));
    }

    /* O6 output */
    const o6y = nodeC[6][0], o6 = LUT.init[idx];
    const ob = buf(492, o6y - 9, 17, 18, { s: C.HOT2, f: "#fdf0e4" });
    wire([[stRight(6), o6y], [492, o6y]], { s: C.HOT, sw: 2 });
    wire([[ob.out[0], o6y], [536, o6y]], { s: C.HOT, sw: 2 });
    txt(542, o6y + 4, "O6", { size: 10, anchor: "start", mono: true, w: 700, fill: C.HOT2 });
    val(590, o6y, o6);
    cap(542, o6y + 18, "any 6-input function", { anchor: "start" });

  const CARRY = { a: [1, 0, 1, 1], b: [1, 1, 0, 1], cin: 0, step: 4, timer: null };

  function carrySolve() {
    const p = [], di = [], c = [CARRY.cin], sum = [];
    for (let i = 0; i < 4; i++) {
      p[i] = CARRY.a[i] ^ CARRY.b[i];
      di[i] = CARRY.a[i];
      c[i + 1] = p[i] ? c[i] : di[i];
      sum[i] = p[i] ^ c[i];
    }
    return { p, di, c, sum };
  }

      txt(OUTX + 6, y + 79, ltr + "MUX", { size: 7.4, anchor: "start", mono: true, w: 620 });
    });

    /* F7 / F8 wide multiplexers */
    const f7b = mux(MUXX, 96, 22, 46, { s: C.CLB.s, sw: 1.1 });   // D + C
    const f7a = mux(MUXX, 312, 22, 46, { s: C.CLB.s, sw: 1.1 });  // B + A
    const f8 = mux(MUXX + 44, 200, 22, 50, { s: C.CLB.s, sw: 1.1 });
    cap(MUXX + 11, 92, "F7BMUX", { fill: C.CLB.t });
    cap(MUXX + 11, 308, "F7AMUX", { fill: C.CLB.t });
    cap(MUXX + 55, 196, "F8MUX", { fill: C.CLB.t });
    wire([[MUXX + 22, 119], [MUXX + 44, 212]], { s: C.CLB.s, sw: 1 });
    wire([[MUXX + 22, 335], [MUXX + 44, 238]], { s: C.CLB.s, sw: 1 });
    wire([[MUXX + 66, 225], [MUXX + 86, 225], [MUXX + 86, 424], [OMX, 424]], { s: C.CLB.s, sw: 1 });

    /* ── right-hand annotation ── */
    const PX = 720, PW = 344;
    frame(PX, 44, PW, 150, "WHAT ONE SLICE GIVES YOU", { bg: "#fdfdfb" });
    [["4", "LUT6, each fracturable into two 5-input LUTs"],
     ["8", "flip-flops — 4 can also be latches, 4 cannot"],
     ["1", "CARRY4 — four bits of dedicated ripple carry"],
     ["3", "wide muxes — F7A, F7B and F8 combine all four"],
     ["1", "shared CLK, 1 shared CE, 1 shared SR"]]
      .forEach(([n, d], i) => {
        const y = 70 + i * 24;
        txt(PX + 34, y, n, { size: 11, anchor: "end", mono: true, w: 700, fill: C.CLB.t });
        txt(PX + 44, y, d, { size: 8.2, anchor: "start", fill: C.MUTE });
      });

    frame(PX, 212, PW, 122, "THE CONSTRAINT THAT BITES", { bg: "#fdfdfb" });
    ["CLK, CE and SR are shared across all eight",
     "flip-flops. Two registers that need different",
     "clock enables cannot share a slice — so the",
     "packer must group by control set, not just",
     "by connectivity. Get this wrong and slice",
     "utilisation collapses."]
      .forEach((s, i) => txt(PX + 16, 236 + i * 15, s, { size: 8.4, anchor: "start", fill: C.MUTE }));

    frame(PX, 352, PW, 128, "SIGNAL COLOURS", { bg: "#fdfdfb" });
    [[C.CLB.s, "solid", "O6 — the 6-input result"],
     [C.GRN, "dashed", "O5 — the fracturable second output"],
     [C.DSP.s, "solid", "dedicated carry, vertical only"],
     [C.CMT.s, "solid", "clock / enable / reset from HROW"]]
      .forEach(([col, kind, d], i) => {
        const y = 378 + i * 25;
        line(PX + 16, y - 3, PX + 52, y - 3, { s: col, sw: 2, dash: kind === "dashed" ? "4 3" : null });
        txt(PX + 60, y, d, { size: 8.2, anchor: "start", fill: C.MUTE });
      });

    return svg(1064, 530, 900);
  };

  /* ============================================================================
     CLB TILE  —  how a signal gets in, through, and back out
     ========================================================================= */
  SCHEM.clb = function () {
    S = [];
    hdr(0, 16, "ONE CLB TILE — logic is the small part; everything around it is interconnect");

    const SBX = 52, SBY = 60, SBW = 120;
    const CHY = 92, CHX = 84;                    // channel centre lines

    /* horizontal + vertical routing channels */
    const CHW = 856, VCH = 282;
    rect(SBX + SBW + 6, CHY - 26, CHW, 52, { f: "#eef2f6", s: "#cdd5dd", sw: .8, rx: 3 });
    txt(SBX + SBW + 16, CHY - 32, "HORIZONTAL CHANNEL — W TRACKS, UNIDIRECTIONAL",
      { size: 6.8, anchor: "start", fill: C.MUTE, mono: true, ls: .7 });
    for (let i = 0; i < 5; i++) {
      const y = CHY - 20 + i * 10;
      line(SBX + SBW + 6, y, SBX + SBW + CHW, y, { s: "#a9b4be", sw: .8, marker: i % 2 ? null : "ah" });
    }
    rect(CHX - 26, SBY + SBW + 6, 52, VCH, { f: "#eef2f6", s: "#cdd5dd", sw: .8, rx: 3 });
    txt(CHX + 32, SBY + SBW + 14, "VERTICAL", { size: 6.8, anchor: "start", fill: C.MUTE, mono: true, ls: .7 });
    txt(CHX + 32, SBY + SBW + 23, "CHANNEL", { size: 6.8, anchor: "start", fill: C.MUTE, mono: true, ls: .7 });
    for (let i = 0; i < 5; i++) {
      const x = CHX - 20 + i * 10;
      line(x, SBY + SBW + 6, x, SBY + SBW + VCH - 6, { s: "#a9b4be", sw: .8 });
    }

    /* switch box */
    rect(SBX, SBY, SBW, SBW, { f: "#fff", s: C.CLB.s, sw: 1.4, rx: 4 });
    txt(SBX + SBW / 2, SBY + 22, "SWITCH BOX", { size: 9, w: 660, fill: C.CLB.t });
    txt(SBX + SBW / 2, SBY + 35, "Fs = 3", { size: 7, mono: true, fill: C.MUTE });
    for (let i = 0; i < 5; i++)
      for (let j = 0; j < 5; j++)
        dot(SBX + 16 + i * 22, SBY + 48 + j * 14, { r: 1.5, s: (i + j) % 3 ? "#c9d0d7" : C.CLB.s });
    txt(SBX + SBW + 12, SBY + SBW - 4, "each turn = one PIP", { size: 6.4, anchor: "start", mono: true, fill: C.FAINT });
    S.push(`<rect class="hit" data-id="switchbox" x="${SBX}" y="${SBY}" width="${SBW}" height="${SBW}" rx="4" fill="transparent" pointer-events="all"/>`);

    /* input connection box */
    const CBX = 190, CBY = 200, CBH = 240;
    rect(CBX, CBY, 46, CBH, { f: C.CLB.f, s: C.CLB.s, sw: 1.1, rx: 3 });
    txt(CBX + 23, CBY + CBH / 2, "CONNECTION BOX  ·  Fc_in", { size: 8, w: 660, fill: C.CLB.t, rot: -90 });
    for (let i = 0; i < 5; i++) {
      const x = CHX - 20 + i * 10, y = CBY + 30 + i * 34;
      wire([[x, y], [CBX, y]], { s: i % 2 ? "#c9d0d7" : C.CLB.s, sw: i % 2 ? .8 : 1.4 });
      if (!(i % 2)) dot(x, y, { s: C.CLB.s });
    }

    /* local input crossbar */
    const XBX = 276, XBW = 62;
    rect(XBX, CBY, XBW, CBH, { f: "#fff", s: C.CLB.s, sw: 1.1, rx: 3 });
    txt(XBX + XBW / 2, CBY + CBH / 2, "LOCAL INPUT CROSSBAR", { size: 8, w: 660, fill: C.CLB.t, rot: -90 });
    txt(XBX + XBW / 2 + 13, CBY + CBH / 2, "sparse — 50–60 % populated", { size: 6.4, mono: true, fill: C.MUTE, rot: -90 });
    for (let i = 0; i < 5; i++) wire([[CBX + 46, CBY + 30 + i * 34], [XBX, CBY + 30 + i * 34]], { s: C.CLB.s, sw: 1 });

    /* the two slices */
    const SLX = 386, SLW = 300;
    [["SLICEM", CBY, "slicem", "logic + distributed RAM + SRL32"],
     ["SLICEL", CBY + 126, "slicel", "logic + arithmetic + wide MUX"]].forEach(([nm, y, id, sub]) => {
      rect(SLX, y, SLW, 114, { f: C.CLB.f, s: C.CLB.s, sw: 1.3, rx: 4 });
      rect(SLX, y, SLW, 114, { f: "url(#tilefine)", rx: 4 });
      txt(SLX + 14, y + 22, nm, { size: 11, anchor: "start", w: 680, fill: C.CLB.t });
      txt(SLX + 14, y + 36, sub, { size: 7, anchor: "start", mono: true, fill: C.MUTE });
      /* four LUT+FF pairs inside */
      for (let i = 0; i < 4; i++) {
        const bx = SLX + 14 + i * 70;
        rect(bx, y + 48, 40, 30, { f: "#fff", s: C.CLB.s, sw: .9, rx: 2 });
        txt(bx + 20, y + 67, "LUT6", { size: 7, mono: true, fill: C.CLB.t, w: 620 });
        ff(bx + 46, y + 48, 20, 30, { s: C.CLB.s });
        wire([[bx + 40, y + 63], [bx + 46, y + 63]], { s: C.CLB.s, sw: .9 });
      }
      txt(SLX + SLW / 2, y + 96, "CARRY4  ·  F7/F8 MUX  ·  shared CLK / CE / SR",
        { size: 6.8, mono: true, fill: C.MUTE });
      txt(SLX + SLW - 14, y + 22, "▸", { size: 10, anchor: "end", fill: C.HOT2, w: 700 });
      S.push(`<rect class="hit" data-id="${id}" x="${SLX}" y="${y}" width="${SLW}" height="114" rx="4" fill="transparent" pointer-events="all"/>`);
      for (let i = 0; i < 5; i++) wire([[XBX + XBW, CBY + 30 + i * 34], [SLX, y + 20 + (i % 4) * 24]], { s: "#c9d0d7", sw: .7 });
    });

    /* carry chain through both slices */
    wire([[SLX + SLW + 16, CBY + 250], [SLX + SLW + 16, CBY - 26]], { s: C.DSP.s, sw: 2, marker: "ah" });
    txt(SLX + SLW + 22, CBY - 30, "CARRY UP THE COLUMN", { size: 6.8, anchor: "start", mono: true, fill: C.DSP.t, w: 600 });

    /* output connection box back onto the channel */
    const OCX = 742;
    rect(OCX, CBY, 46, CBH, { f: C.CLB.f, s: C.CLB.s, sw: 1.1, rx: 3 });
    txt(OCX + 23, CBY + CBH / 2, "CONNECTION BOX  ·  Fc_out", { size: 8, w: 660, fill: C.CLB.t, rot: -90 });
    for (let i = 0; i < 5; i++) wire([[SLX + SLW, CBY + 24 + i * 44], [OCX, CBY + 24 + i * 44]], { s: C.CLB.s, sw: 1 });
    wire([[OCX + 46, CBY + 60], [848, CBY + 60], [848, CHY], [SBX + SBW + 820, CHY]], { s: C.CLB.s, sw: 1.4, marker: "ah" });
    txt(768, CBY + 78, "back to channel", { size: 6.8, anchor: "start", mono: true, fill: C.MUTE });

    /* the point of the picture */
    frame(880, 200, 184, 240, "AREA BUDGET", { bg: "#fdfdfb" });
    const budget = [["interconnect", 72, C.CLB.s], ["logic (LUT+FF)", 20, C.BRAM.s], ["config cells", 8, C.CFG.s]];
    let by = 232;
    budget.forEach(([n, p, col]) => {
      txt(896, by, n, { size: 8, anchor: "start", fill: C.MUTE });
      txt(1048, by, p + " %", { size: 8.6, anchor: "end", mono: true, w: 700, fill: col });
      rect(896, by + 6, 152, 8, { f: "#f0f2f4", rx: 4 });
      rect(896, by + 6, 152 * p / 100, 8, { f: col, rx: 4 });
      by += 34;
    });
    ["Roughly two thirds of a real FPGA",
     "die is wires and switches, not logic.",
     "Any architecture study that only",
     "counts LUTs is measuring the",
     "smallest part of the chip."]
      .forEach((s, i) => txt(896, 344 + i * 14, s, { size: 7.8, anchor: "start", fill: C.MUTE }));

    /* the path narrative along the bottom */
    const steps = ["SWITCH BOX", "CONNECTION BOX", "LOCAL CROSSBAR", "LUT INPUT", "LUT / CARRY / FF",
      "SLICE OUTPUT", "CONNECTION BOX", "SWITCH BOX"];
    const sw = 116, sy = 486;
    steps.forEach((s, i) => {
      const x = 22 + i * (sw + 14);
      rect(x, sy, sw, 26, { f: i >= 3 && i <= 4 ? C.CLB.f : "#f4f6f8", s: i >= 3 && i <= 4 ? C.CLB.s : "#cdd5dd", sw: 1, rx: 3 });
      txt(x + sw / 2, sy + 17, s, { size: 7, mono: true, w: 620, fill: i >= 3 && i <= 4 ? C.CLB.t : C.MUTE });
      if (i < steps.length - 1) line(x + sw + 2, sy + 13, x + sw + 12, sy + 13, { s: "#8e8e86", sw: 1.2, marker: "ah" });
    });
    txt(22, sy - 8, "THE FULL PATH OF ONE SIGNAL", { size: 6.8, anchor: "start", fill: C.FAINT, mono: true, ls: .8 });

    return svg(1064, 528, 900);
  };

  /* ============================================================================
     SLICEM  —  the same LUT cells, rewritable at run time
     ========================================================================= */
  SCHEM.slicem = function () {
    S = [];
    hdr(0, 16, "SLICEM — the LUT's 64 memory cells, now writable while the design runs");

    /* mode 1: logic */
    frame(16, 42, 330, 220, "MODE 1 — LOGIC (identical to SLICEL)", { bg: "#fdfdfb" });
    rect(56, 78, 250, 150, { f: C.CLB.f, s: C.CLB.s, sw: 1.2, rx: 4 });
    txt(181, 104, "64 SRAM CELLS", { size: 9.6, w: 660, fill: C.CLB.t });
    txt(181, 120, "written once, at configuration", { size: 7, mono: true, fill: C.MUTE });
    for (let i = 0; i < 32; i++) cell(72 + (i % 16) * 14, 136 + Math.floor(i / 16) * 14, 11, 11, (i * 7) % 3 ? 1 : 0);
    txt(181, 190, "read as a truth table", { size: 8, w: 620, fill: C.CLB.t });
    bus(306, 202, 334, 202, "1", { s: C.CLB.s, marker: "ah" });
    txt(181, 212, "O6 / O5", { size: 7.6, mono: true, fill: C.MUTE });

    /* mode 2: distributed RAM */
    frame(366, 42, 330, 220, "MODE 2 — DISTRIBUTED RAM (SLICEM ONLY)", { bg: "#fdfdfb" });
    rect(406, 78, 250, 150, { f: C.BRAM.f, s: C.BRAM.s, sw: 1.2, rx: 4 });
    txt(531, 104, "THE SAME 64 CELLS", { size: 9.6, w: 660, fill: C.BRAM.t });
    txt(531, 120, "now a 64 × 1 memory", { size: 7, mono: true, fill: C.MUTE });
    for (let i = 0; i < 32; i++) cell(422 + (i % 16) * 14, 136 + Math.floor(i / 16) * 14, 11, 11, (i * 5) % 4 ? 1 : 0, { onf: C.BRAM.s });
    txt(531, 190, "read AND write at run time", { size: 8, w: 620, fill: C.BRAM.t });
    /* the extra write port that costs the area */
    wire([[366, 130], [406, 130]], { s: C.HOT, sw: 1.6, marker: "ah" });
    txt(362, 126, "WE", { size: 7.4, anchor: "end", mono: true, w: 620, fill: C.HOT2 });
    wire([[366, 150], [406, 150]], { s: C.HOT, sw: 1.6, marker: "ah" });
    txt(362, 146, "WCLK", { size: 7.4, anchor: "end", mono: true, w: 620, fill: C.HOT2 });
    wire([[366, 170], [406, 170]], { s: C.HOT, sw: 1.6, marker: "ah" });
    txt(362, 166, "DI", { size: 7.4, anchor: "end", mono: true, w: 620, fill: C.HOT2 });
    cap(531, 246, "this write port is the only added silicon");

    /* mode 3: shift register */
    frame(716, 42, 332, 220, "MODE 3 — SHIFT REGISTER (SRL32)", { bg: "#fdfdfb" });
    const sx = 740, sy = 132;
    wire([[sx - 16, sy + 16], [sx, sy + 16]], { s: C.BRAM.s, sw: 1.4, marker: "ah" });
    txt(sx - 20, sy + 20, "D", { size: 7.4, anchor: "end", mono: true, w: 620 });
    for (let i = 0; i < 5; i++) {
      const x = sx + i * 44;
      ff(x, sy, 32, 34, { s: C.BRAM.s });
      if (i < 4) wire([[x + 32, sy + 17], [x + 44, sy + 17]], { s: C.BRAM.s, sw: 1.2 });
      dot(x + 16, sy + 52, { s: C.BRAM.s });
      wire([[x + 16, sy + 34], [x + 16, sy + 62]], { s: "#c9d0d7", sw: .9 });
    }
    txt(sx + 108, sy - 12, "… 32 stages …", { size: 7.4, mono: true, fill: C.FAINT });
    mux(sx + 224, sy + 40, 24, 46, { s: C.BRAM.s, sw: 1.2, label: "32:1" });
    wire([[sx + 4, sy + 62], [sx + 224, sy + 62]], { s: "#c9d0d7", sw: .9 });
    wire([[sx + 248, sy + 63], [sx + 274, sy + 63]], { s: C.BRAM.s, sw: 1.4, marker: "ah" });
    txt(sx + 280, sy + 67, "Q", { size: 7.4, anchor: "start", mono: true, w: 620 });
    txt(sx + 200, sy + 100, "A[4:0] — addressable tap", { size: 7, anchor: "start", mono: true, fill: C.MUTE });
    cap(sx + 146, sy + 116, "one LUT = 32 flip-flops of delay, at a fraction of the area");

    /* payoff */
    frame(16, 288, 1032, 96, "WHY THIS MATTERS TO YOU", { bg: "#fdfdfb" });
    [["FIFOs and delay lines", "an SRL32 costs one LUT; 32 real flip-flops cost eight slices"],
     ["ILA capture buffers", "short traces fit in SRLs and leave your BRAMs for the design"],
     ["typically 1 slice in 4", "the write port costs area, so you do not pay for it everywhere"]]
      .forEach(([a, b], i) => {
        const y = 316 + i * 22;
        txt(36, y, a, { size: 8.6, anchor: "start", w: 660, fill: C.BRAM.t });
        txt(232, y, b, { size: 8.2, anchor: "start", fill: C.MUTE });
      });

    return svg(1064, 400, 880);
  };

  /* ============================================================================
     SWITCH BOX  —  what a programmable connection physically is
     ========================================================================= */
  SCHEM.switchbox = function () {
    S = [];
    hdr(0, 16, "THE PROGRAMMABLE INTERCONNECT — a switch box, and the switch inside it");

    /* ── left: the switch box topology ── */
    const BX = 96, BY = 108, BW = 260, W4 = 4;
    frame(30, 46, 420, 428, "SWITCH BOX  ·  W = 4 TRACKS PER SIDE  ·  Fs = 3", { bg: "#fdfdfb" });
    rect(BX, BY, BW, BW, { f: "#f6f8fa", s: C.CLB.s, sw: 1.4, rx: 5 });

    const tp = i => BX + 34 + i * 64;
    const sides = {
      N: i => [tp(i), BY], S: i => [tp(i), BY + BW],
      W: i => [BX, tp(i)], E: i => [BX + BW, tp(i)]
    };
    Object.entries(sides).forEach(([k, f]) => {
      for (let i = 0; i < W4; i++) {
        const [x, y] = f(i);
        const d = k === "N" ? [0, -26] : k === "S" ? [0, 26] : k === "W" ? [-26, 0] : [26, 0];
        line(x, y, x + d[0], y + d[1], { s: "#a9b4be", sw: 1.4 });
        txt(x + d[0] * 1.42, y + d[1] * 1.42 + (d[1] ? (d[1] > 0 ? 6 : -1) : 3), k + i,
          { size: 6.4, mono: true, fill: C.FAINT, anchor: d[0] ? (d[0] > 0 ? "start" : "end") : "middle" });
      }
    });

    /* one incoming track fans out to exactly three others — that is Fs = 3 */
    /* the signal arrives on the W1 row and runs straight across to E1; the two other
       destinations branch off it, each turning at the crossing of its own column —
       that crossing is exactly where the PIP sits */
    const src = sides.W(1), sy = src[1];
    wire([[src[0], sy], [sides.E(1)[0], sy]], { s: C.HOT, sw: 2 });
    [sides.N(2), sides.S(0)].forEach(d => {
      wire([[d[0], sy], [d[0], d[1]]], { s: C.HOT, sw: 2 });
      dot(d[0], sy, { s: C.HOT2, r: 2.6 });
    });
    dot(src[0], sy, { s: C.HOT2, r: 3 });

    txt(226, 430, "ONE TRACK IN  →  THREE TRACKS OUT", { size: 8.2, mono: true, fill: C.HOT2, w: 700, ls: .5 });
    txt(226, 446, "WILTON — the track index rotates when a signal turns", { size: 7.2, mono: true, fill: C.MUTE });
    txt(226, 460, "mixing track domains is what makes a channel routable", { size: 7.2, mono: true, fill: C.FAINT });

    /* ── right: one PIP, as a switch and as silicon ── */
    frame(478, 46, 570, 428, "ONE PIP  ·  WHAT “PROGRAMMABLE” ACTUALLY MEANS", { bg: "#fdfdfb" });
    const MY = 104, PITCH = 52, BX2 = 590, BLADE = 30, NODE = 700;

    for (let i = 0; i < 4; i++) {
      const y = MY + i * PITCH, on = i === 2;
      const col = on ? C.HOT : "#b3bac1";
      txt(536, y + 3, "track " + i, { size: 7.2, anchor: "end", mono: true, fill: on ? C.HOT2 : C.FAINT, w: on ? 620 : 400 });
      wire([[542, y], [BX2, y]], { s: col, sw: on ? 2 : 1.2 });
      /* the switch itself: closed = a wire, open = a lifted blade */
      if (on) wire([[BX2, y], [BX2 + BLADE, y]], { s: C.HOT, sw: 2 });
      else path(`M${BX2},${y} L${BX2 + BLADE - 3},${y - 12}`, { s: "#9aa2aa", sw: 1.6, cap: "round" });
      dot(BX2, y, { s: col });
      dot(BX2 + BLADE, y, { s: on ? C.HOT2 : "#c2c8ce" });
      wire([[BX2 + BLADE, y], [NODE, y]], { s: on ? C.HOT : "#e4e8eb", sw: on ? 2 : 1 });
      /* the configuration bit that holds it open or closed */
      cell(BX2 + BLADE / 2 - 8, y + 15, 16, 13, on ? 1 : 0, { showv: true });
      wire([[BX2 + BLADE / 2, y + 15], [BX2 + BLADE / 2, y + 5]], { s: on ? C.HOT2 : "#c9d0d7", sw: 1, dash: "3 2" });
    }
    cap(BX2 + BLADE / 2, MY + 3 * PITCH + 44, "one configuration bit per input");

    /* the shared node, restored by a buffer */
    wire([[NODE, MY], [NODE, MY + 3 * PITCH]], { s: C.WIRE, sw: 1.4 });
    const b = buf(NODE, MY + 64, 28, 30, { s: C.CLB.s, f: "#fff" });
    wire([[b.out[0], MY + 79], [900, MY + 79]], { s: C.HOT, sw: 2, marker: "ah" });
    txt(906, MY + 83, "outgoing", { size: 7.6, anchor: "start", mono: true, w: 620 });
    txt(906, MY + 94, "track", { size: 7.6, anchor: "start", mono: true, w: 620 });
    cap(742, MY + 116, "buffer / level restorer", { anchor: "start" });
    cap(742, MY + 126, "every hop costs one of these", { anchor: "start" });

    /* what it adds up to */
    rect(500, 322, 526, 130, { f: "#fbfaf7", s: "#e6eaee", sw: 1, rx: 6 });
    txt(522, 348, "A ROUTED NET IS A CHAIN OF THESE", { size: 9, anchor: "start", w: 680, ls: .5 });
    ["Delay grows with the number of switches a signal crosses, not with the",
     "distance it covers — which is exactly why a fabric offers L1, L4 and L12",
     "wire lengths instead of building everything from single-tile segments."]
      .forEach((s, i) => txt(522, 370 + i * 16, s, { size: 8.4, anchor: "start", fill: C.MUTE }));
    txt(522, 432, "≈ 63 % of every bit in a real bitstream is a routing bit, not logic",
      { size: 8, anchor: "start", mono: true, fill: C.HOT2, w: 600 });

    /* wire-length menu */
    hdr(30, 510, "the wire menu — a router picks segment length, not just direction");
    [["SINGLE (L1)", "spans 1 tile", "cheap, flexible, slow over distance", 30],
     ["DOUBLE / QUAD (L4)", "spans 4 tiles", "the workhorse", 376],
     ["LONG LINE (L12)", "spans 12+ tiles", "few switches, low delay, scarce", 722]]

  /* ============================================================================
     CONFIGURATION CELL  —  6T SRAM, and what it is wired to
     ========================================================================= */
  SCHEM.configcell = function () {
    S = [];
    hdr(0, 16, "THE CONFIGURATION CELL — one 6T SRAM bit, repeated a few million times");

    /* ── the cell itself ──
       Standard orientation: one horizontal word line across the row, two vertical
       bit lines down the column, access transistors with horizontal channels. */
    frame(24, 46, 420, 362, "6T CELL  ·  TWO CROSS-COUPLED INVERTERS + TWO ACCESS TRANSISTORS", { bg: "#fdfdfb" });
    const WL = 126, ACC = 172, xBL = 64, xBLB = 380;
    const QB = 128, Q = 316;                       /* the two storage nodes */

    /* word line — ONE wire, ONE label, straight across the row */
    line(52, WL, 400, WL, { s: C.HOT, sw: 1.8 });
    txt(52, WL - 8, "WORD LINE", { size: 7.4, anchor: "start", mono: true, w: 660, fill: C.HOT2 });
    txt(400, WL - 8, "pulsed only during configuration and readback",
      { size: 6.4, anchor: "end", mono: true, fill: C.FAINT });

    /* bit lines — vertical, down the column; they cross the word line on another layer */
    [[xBL, "BL"], [xBLB, "BLB"]].forEach(([x, n]) => {
      line(x, 84, x, ACC, { s: "#8f9ba7", sw: 1.4 });
      txt(x, 76, n, { size: 7.6, mono: true, fill: C.MUTE, w: 660 });
    });

    /* access transistors — gates tapped straight off the word line above them */
    const m1 = nmosH(100, ACC, { s: C.CFG.s, w: 28, gateTo: WL });
    const m2 = nmosH(316, ACC, { s: C.CFG.s, w: 28, gateTo: WL });
    dot(m1.g[0], WL, { s: C.HOT2 });
    dot(m2.g[0], WL, { s: C.HOT2 });
    wire([[xBL, ACC], [100, ACC]], { s: "#8f9ba7", sw: 1.4 });
    wire([[344, ACC], [xBLB, ACC]], { s: "#8f9ba7", sw: 1.4 });

    /* the two storage nodes drop to the inverter pair */
    wire([[QB, ACC], [QB, 280]], { s: C.CFG.s, sw: 1.4 });
    wire([[Q, ACC], [Q, 300]], { s: C.CFG.s, sw: 1.4 });
    txt(QB - 9, 214, "Q̄", { size: 10, anchor: "end", mono: true, w: 700, fill: C.CFG.t });
    txt(Q + 9, 214, "Q", { size: 10, anchor: "start", mono: true, w: 700, fill: C.CFG.t });

    /* cross-coupled inverters: one points right, one points left */
    path(`M160,222 L216,240 L160,258 Z`, { f: "#fff", s: C.CFG.s, sw: 1.1 });
    S.push(`<circle cx="219" cy="240" r="2.6" fill="#fff" stroke="${C.CFG.s}" stroke-width="1.1"/>`);
    path(`M284,262 L228,280 L284,298 Z`, { f: "#fff", s: C.CFG.s, sw: 1.1 });
    S.push(`<circle cx="225" cy="280" r="2.6" fill="#fff" stroke="${C.CFG.s}" stroke-width="1.1"/>`);

    wire([[QB, 240], [160, 240]], { s: C.CFG.s, sw: 1.4 });          /* Q̄ → inv1 in  */
    wire([[222, 240], [Q, 240]], { s: C.CFG.s, sw: 1.4 });           /* inv1 out → Q  */
    wire([[Q, 280], [284, 280]], { s: C.CFG.s, sw: 1.4 });           /* Q  → inv2 in  */
    wire([[222, 280], [QB, 280]], { s: C.CFG.s, sw: 1.4 });          /* inv2 out → Q̄ */
    dot(QB, 240, { s: C.CFG.s }); dot(Q, 240, { s: C.CFG.s });
    dot(QB, 280, { s: C.CFG.s }); dot(Q, 280, { s: C.CFG.s });
    cap(234, 318, "whichever way it settles, it holds — no clock, no refresh");

    /* Q is never read like a memory: it sits on the gate of a switch out in the fabric */
    dot(Q, 300, { s: C.CFG.s });
    wire([[Q, 300], [400, 300], [400, 326], [214, 326]], { s: C.CFG.s, sw: 1.4 });
    nmosH(200, 352, { s: C.CLB.s, w: 28, gateTo: 326 });
    wire([[96, 352], [200, 352]], { s: C.CLB.s, sw: 1.5 });
    wire([[228, 352], [340, 352]], { s: C.CLB.s, sw: 1.5, marker: "ah" });
    txt(92, 355, "wire", { size: 6.8, anchor: "end", mono: true, fill: C.CLB.t });
    txt(346, 355, "wire", { size: 6.8, anchor: "start", mono: true, fill: C.CLB.t });
    cap(234, 376, "a routing PIP, or one leg of a LUT mux tree");
    cap(234, 388, "Q holds this switch open or closed for as long as the design runs");

    /* ── the write path ── */
    frame(468, 46, 580, 362, "HOW A BIT GETS THERE  ·  THE FRAME IS THE ATOMIC UNIT", { bg: "#fdfdfb" });
    const steps = [
      ["FDRI", "frame data register in — the payload", C.CFG],
      ["FAR", "frame address: row · column · minor", C.CFG],
      ["COLUMN DECODE", "picks one configuration column", C.CFG],
      ["FRAME SHIFT REGISTER", "one frame ≈ 101 × 32 bits", C.CFG],
      ["WORD LINE PULSE", "the whole frame lands at once", C.HOT2]
    ];
    steps.forEach(([n, d, k], i) => {
      const y = 82 + i * 54;
      rect(492, y, 250, 40, { f: (k.f || "#fdf0e4"), s: (k.s || C.HOT2), sw: 1.1, rx: 4 });
      txt(617, y + 18, n, { size: 9, w: 660, fill: (k.t || C.HOT2) });
      txt(617, y + 31, d, { size: 6.8, mono: true, fill: C.MUTE });
      if (i < steps.length - 1) line(617, y + 40, 617, y + 52, { s: "#8e8e86", sw: 1.2, marker: "ah" });
    });
    /* readback path back up the right side */
    wire([[742, 300], [800, 300], [800, 100], [742, 100]], { s: C.GRN, sw: 1.5, dash: "5 3", marker: "ah" });
    txt(808, 196, "READBACK", { size: 8.4, anchor: "start", mono: true, w: 660, fill: C.GRN });
    ["FDRO reads the same cells back out.",
     "That single feature buys you:",
     "· verify-after-program",
     "· ILA capture without a data path",
     "· partial reconfiguration",
     "It costs almost nothing to add —",
     "and is painful to retrofit."]
      .forEach((s, i) => txt(808, 216 + i * 14, s, { size: 7.8, anchor: "start", fill: C.MUTE }));

    /* the ASIC-implementation warning */
    frame(24, 428, 1024, 96, "THE MISTAKE THAT MAKES AN eFPGA 10× TOO BIG", { bg: "#fdfdfb" });
    [["a standard-cell flip-flop", "~ 20 transistors + full clock tree + scan", "#bb5340", 260],
     ["a custom 6T SRAM cell", "6 transistors, no clock, laid out on pitch", "#3d8a58", 660]]
      .forEach(([n, d, col, x]) => {
        rect(x - 220, 452, 380, 54, { f: "#fff", s: col, sw: 1.2, rx: 5 });
        txt(x - 30, 474, n, { size: 9.6, w: 680, fill: col });
        txt(x - 30, 490, d, { size: 7.4, mono: true, fill: C.MUTE });
      });
    txt(884, 474, "the config plane is", { size: 8, anchor: "start", fill: C.MUTE });
    txt(884, 488, "most of your area — treat", { size: 8, anchor: "start", fill: C.MUTE });
    txt(884, 502, "it as a memory, not logic", { size: 8, anchor: "start", fill: C.MUTE });

    return svg(1064, 542, 900);
  };

  /* ============================================================================
     BRAM  —  true dual port
     ========================================================================= */
  SCHEM.bram = function () {
    S = [];
    hdr(0, 16, "BRAM — one 36 Kb array with two completely independent ports");

    const AY = 96, AH = 220, AX = 392, AW = 280;
    rect(AX, AY, AW, AH, { f: C.BRAM.f, s: C.BRAM.s, sw: 1.4, rx: 5 });
    rect(AX, AY, AW, AH, { f: "url(#tilefine)", rx: 5 });
    txt(AX + AW / 2, AY + AH / 2 - 12, "36 Kb ARRAY", { size: 14, w: 680, fill: C.BRAM.t });
    txt(AX + AW / 2, AY + AH / 2 + 8, "or 2 × 18 Kb, fully independent", { size: 8, mono: true, fill: C.MUTE });
    txt(AX + AW / 2, AY + AH / 2 + 26, "32K×1 … 512×72", { size: 8, mono: true, fill: C.MUTE });

    [["A", 0, C.BRAM.s], ["B", 1, "#2f7048"]].forEach(([p, side, col]) => {
      const dir = side ? 1 : -1;
      const ex = side ? AX + AW : AX;
      const sx = side ? 760 : 304;
      const y0 = AY + 20;
      /* address / control in */
      [["ADDR" + p, "[14:0]", 0], ["WE" + p, "byte enables", 34], ["DIN" + p, "[35:0]", 68]].forEach(([n, c, dy]) => {
        const y = y0 + dy;
        bus(sx, y, ex, y, null, { s: col, marker: "ah" });
        txt(sx - dir * 8, y - 4, n, { size: 8, anchor: side ? "start" : "end", mono: true, w: 640, fill: col });
        txt(sx - dir * 8, y + 8, c, { size: 6.4, anchor: side ? "start" : "end", mono: true, fill: C.FAINT });
      });
      /* output register — the option people forget to turn on */
      const ry = y0 + 118;
      const rx0 = side ? ex + 8 : ex - 64;
      rect(rx0, ry - 18, 56, 36, { f: "#fff", s: col, sw: 1.2, rx: 3 });
      txt(rx0 + 28, ry - 2, "OPT", { size: 7.6, w: 660, fill: col });
      txt(rx0 + 28, ry + 9, "REG", { size: 7.6, w: 660, fill: col });
      path(`M${rx0 + 4},${ry + 8} L${rx0 + 11},${ry + 12.5} L${rx0 + 4},${ry + 17}`, { s: col, sw: 1 });
      wire([[ex, ry], [side ? rx0 : rx0 + 56, ry]], { s: col, sw: 1.6 });
      wire([[side ? rx0 + 56 : rx0, ry], [sx, ry]], { s: col, sw: 1.6, marker: "ah" });
      txt(sx - dir * 8, ry - 4, "DOUT" + p, { size: 8, anchor: side ? "start" : "end", mono: true, w: 640, fill: col });
      cap(side ? rx0 : rx0 + 56, ry + 32, "+1 cycle, ~2× Fmax", { anchor: side ? "start" : "end" });
      /* independent clock */
      const cy2 = y0 + 172;
      wire([[sx, cy2], [ex, cy2]], { s: C.CMT.s, sw: 1.6, marker: "ah" });
      txt(sx - dir * 8, cy2 - 4, "CLK" + p, { size: 8, anchor: side ? "start" : "end", mono: true, w: 640, fill: C.CMT.t });
      txt(sx - dir * 8, cy2 + 8, "own domain", { size: 6.4, anchor: side ? "start" : "end", mono: true, fill: C.FAINT });
      /* port caption */
      txt(side ? 900 : 164, AY + 4, "PORT " + p, { size: 11, w: 700, fill: col, ls: 1 });
    });

    /* hard extras that live in the same tile */
    hdr(24, 372, "hard logic that ships inside the same tile — free if you use it");
    [["FIFO18 / FIFO36", "pointers, FULL / EMPTY, programmable almost-flags", "no LUTs spent on a FIFO controller"],
     ["ECC", "64 data + 8 parity — corrects 1 bit, detects 2", "for anything that must survive SEUs"],
     ["CASCADE", "chain two BRAMs vertically for depth", "without paying an address-decode LUT"]]
      .forEach(([n, d, why], i) => {
        const x = 24 + i * 344;
        rect(x, 388, 324, 66, { f: "#fff", s: C.BRAM.s, sw: 1.1, rx: 5 });
        txt(x + 16, 410, n, { size: 9.4, anchor: "start", w: 680, fill: C.BRAM.t });
        txt(x + 16, 426, d, { size: 7.4, anchor: "start", mono: true, fill: C.MUTE });
        txt(x + 16, 442, why, { size: 7.4, anchor: "start", fill: C.FAINT });
      });

    txt(0, 484, "True dual port with independent clocks is what makes BRAM the universal crossing structure:"
      + " CDC FIFOs, caches, line buffers and your ILA capture buffer are all the same block wired differently.",
      { size: 8, anchor: "start", fill: C.MUTE });

    return svg(1064, 500, 880);
  };

  /* ============================================================================
     DSP48E1  —  the datapath, left to right
     ========================================================================= */
  SCHEM.dsp = function () {
    S = [];
    hdr(0, 16, "DSP48E1 — a fixed datapath with four optional pipeline registers");

    const Y = 120, H = 76;
    const stages = [
      ["PRE-ADDER", "D ± A", 140, C.DSP],
      ["25 × 18", "MULTIPLIER", 140, C.DSP],
      ["48-BIT ALU", "add / sub / accumulate / logic", 176, C.DSP],
      ["PATTERN DETECT", "overflow · round · compare", 160, C.DSP]
    ];
    let x = 132;
    const xs = [];
    stages.forEach(([n, c, w, k], i) => {
      xs.push(x);
      rect(x, Y, w, H, { f: k.f, s: k.s, sw: 1.3, rx: 5 });
      txt(x + w / 2, Y + 32, n, { size: 10.5, w: 680, fill: k.t });
      txt(x + w / 2, Y + 48, c, { size: 7.4, mono: true, fill: C.MUTE });
      if (i < stages.length - 1) {
        /* pipeline register between every stage */
        const rx0 = x + w + 6;
        rect(rx0, Y + 16, 16, 44, { f: "#fff", s: C.DSP.s, sw: 1.1, rx: 2 });
        path(`M${rx0 + 3},${Y + 46} L${rx0 + 9},${Y + 50} L${rx0 + 3},${Y + 54}`, { s: C.DSP.s, sw: 1 });
        cap(rx0 + 8, Y + 12, "REG");
        wire([[x + w, Y + H / 2], [rx0, Y + H / 2]], { s: C.DSP.s, sw: 1.6 });
        wire([[rx0 + 16, Y + H / 2], [rx0 + 30, Y + H / 2]], { s: C.DSP.s, sw: 1.6, marker: "ah" });
        x = rx0 + 30;
      } else x += w;
    });

    /* operand inputs */
    [["A", "30 b", 0], ["B", "18 b", 26], ["C", "48 b", 52], ["D", "25 b", 78]].forEach(([n, w, dy], i) => {
      const y = Y - 24 + dy;
      bus(44, y, 124, y, w, { s: C.DSP.s, marker: "ah", dy: 5 });
      txt(38, y + 3, n, { size: 10, anchor: "end", mono: true, w: 700, fill: C.DSP.t });
    });
    /* result */
    bus(x, Y + H / 2, x + 62, Y + H / 2, "48 b", { s: C.DSP.s, marker: "ah" });
    txt(x + 70, Y + H / 2 + 4, "P", { size: 11, anchor: "start", mono: true, w: 700, fill: C.DSP.t });

    /* cascade paths — the thing that actually matters */
    wire([[44, Y + 150], [x + 24, Y + 150]], { s: C.HOT, sw: 2, marker: "ah" });
    txt(38, Y + 154, "ACIN", { size: 8, anchor: "end", mono: true, w: 640, fill: C.HOT2 });
    txt(x + 32, Y + 154, "ACOUT", { size: 8, anchor: "start", mono: true, w: 640, fill: C.HOT2 });
    wire([[44, Y + 178], [x + 24, Y + 178]], { s: C.HOT, sw: 2, marker: "ah" });
    txt(38, Y + 182, "PCIN", { size: 8, anchor: "end", mono: true, w: 640, fill: C.HOT2 });
    txt(x + 32, Y + 182, "PCOUT", { size: 8, anchor: "start", mono: true, w: 640, fill: C.HOT2 });
    txt(x / 2, Y + 208, "CASCADE — chains DSP to DSP with zero general routing, which is why DSP columns are physically contiguous",
      { size: 8, fill: C.HOT2, mono: true });

    /* the honest recommendation */
    frame(24, Y + 236, 1024, 92, "FOR YOUR OWN FABRIC", { bg: "#fdfdfb" });
    ["This is the block to leave out of v1. It is a large, heavily pipelined design, and CLB + CARRY4 can emulate every",
     "mode of it at lower Fmax. Add a DSP column only once your placer, router and architecture description already",
     "handle heterogeneous columns — otherwise you are debugging two hard problems at the same time."]
      .forEach((s, i) => txt(48, Y + 264 + i * 17, s, { size: 8.6, anchor: "start", fill: C.MUTE }));

    return svg(1064, Y + 350, 880);
  };

  /* ============================================================================
     CMT  —  from a board pin to a flip-flop's clock input
     ========================================================================= */
  SCHEM.cmt = function () {
    S = [];
    hdr(0, 16, "THE CLOCK PATH — a dedicated, balanced tree that never touches the general interconnect");

    const Y = 130;
    /* differential input pin */
    port(56, Y - 12); port(56, Y + 12);
    txt(48, Y - 8, "clk_p", { size: 7.6, anchor: "end", mono: true, w: 620 });
    txt(48, Y + 16, "clk_n", { size: 7.6, anchor: "end", mono: true, w: 620 });
    const ib = buf(96, Y - 18, 34, 36, { s: C.IO.s, f: C.IO.f });
    wire([[56, Y - 12], [96, Y - 12]], { s: C.IO.s, sw: 1.2 });
    wire([[56, Y + 12], [96, Y + 12]], { s: C.IO.s, sw: 1.2 });
    cap(113, Y + 30, "IBUFDS");

    /* MMCM */
    const MX = 178, MW = 176;
    rect(MX, Y - 56, MW, 112, { f: C.CMT.f, s: C.CMT.s, sw: 1.4, rx: 5 });
    txt(MX + MW / 2, Y - 32, "MMCM", { size: 13, w: 680, fill: C.CMT.t });
    txt(MX + MW / 2, Y - 16, "PFD → CP → LF → VCO", { size: 7, mono: true, fill: C.MUTE });
    txt(MX + MW / 2, Y + 2, "÷D  ×M  ÷O", { size: 8.6, mono: true, w: 660, fill: C.CMT.t });
    txt(MX + MW / 2, Y + 20, "phase shift · duty cycle", { size: 7, mono: true, fill: C.MUTE });
    txt(MX + MW / 2, Y + 34, "jitter filter · DRP", { size: 7, mono: true, fill: C.MUTE });
    wire([[130, Y], [MX, Y]], { s: C.CMT.s, sw: 1.6, marker: "ah" });

    /* up to 7 outputs, one taken forward */
    for (let i = 0; i < 4; i++) {
      const y = Y - 42 + i * 28;
      wire([[MX + MW, y], [MX + MW + 26, y]], { s: i === 1 ? C.CMT.s : "#c9d0d7", sw: i === 1 ? 1.8 : 1 });
      txt(MX + MW + 30, y + 3, "CLKOUT" + i, { size: 6.6, anchor: "start", mono: true, fill: i === 1 ? C.CMT.t : C.FAINT });
    }

    /* BUFG */
    const BX = 440;
    const bg = buf(BX, Y - 32, 40, 40, { s: C.CMT.s, f: "#fff" });
    wire([[MX + MW + 78, Y - 14], [BX, Y - 12]], { s: C.CMT.s, sw: 1.8 });
    txt(BX + 20, Y - 8, "BUFG", { size: 8, w: 660, fill: C.CMT.t });
    cap(MX, Y + 96, "up to 7 synthesised outputs  ·  BUFG is 1 of 32 global clock buffers",
      { anchor: "start" });

    /* the spine and the H trees */
    const SPX = 560;
    wire([[BX + 40, Y - 12], [SPX, Y - 12], [SPX, 84], [SPX, 396]], { s: C.CMT.s, sw: 2.4 });
    txt(SPX + 8, 74, "GLOBAL SPINE", { size: 7.6, anchor: "start", mono: true, w: 640, fill: C.CMT.t });

    for (let r = 0; r < 3; r++) {
      const hy = 130 + r * 118;
      wire([[SPX, hy], [1000, hy]], { s: C.CMT.s, sw: 1.8, marker: "ah" });
      dot(SPX, hy, { s: C.CMT.s });
      txt(1006, hy + 3, "HROW", { size: 7.6, anchor: "start", mono: true, w: 640, fill: C.CMT.t });
      txt(620, hy - 8, `CLOCK REGION X0Y${2 - r}  ·  12 CLOCKS`, { size: 6.8, anchor: "start", mono: true, fill: C.MUTE, ls: .6 });
      /* leaf buffers down into the tiles */
      for (let i = 0; i < 8; i++) {
        const lx = 620 + i * 46;
        wire([[lx, hy], [lx, hy + 30]], { s: "#b9a8d0", sw: 1.1 });
        const lb = buf(lx - 7, hy + 30, 14, 14, { s: C.CMT.s, f: "#fff" });
        wire([[lx, hy + 44], [lx, hy + 54]], { s: "#b9a8d0", sw: 1 });
        rect(lx - 13, hy + 54, 26, 20, { f: C.CLB.f, s: C.CLB.s, sw: .8, rx: 2 });
        if (i === 0) { cap(lx, hy + 88, "BUFH"); cap(lx + 40, hy + 88, "tiles"); }
      }
    }

    cap(824, 468, "each band is one clock region — 50 CLBs tall in a 7-series part");

    /* the rule */
    frame(24, 492, 1024, 96, "THE ONE RULE", { bg: "#fdfdfb" });
    txt(48, 520, "A clock never travels on the general interconnect.", { size: 11, anchor: "start", w: 680, fill: C.CMT.t });
    ["Ordinary routing has data-dependent, unbalanced delay. Put a clock on it and skew between two flip-flops exceeds",
     "the clock period — the design simulates perfectly and fails in silicon. For a v1 fabric: build one balanced global",
     "clock spine and one reset spine, and stop there. A PLL is a substantial analog design; instantiate a vendor one first."]
      .forEach((s, i) => txt(48, 542 + i * 15, s, { size: 8.4, anchor: "start", fill: C.MUTE }));

    return svg(1064, 608, 900);
  };

  /* ============================================================================
