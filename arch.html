<meta charset="utf-8">
<title>bob — Interactive Die Slice</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @page { size: A3 landscape; margin: 8mm }

  :root {
    --ink: #17171a;
    --ink-2: #4a4a52;
    --mute: #74747e;
    --faint: #9a9aa4;
    --rule: #e4e4dd;
    --rule-2: #f0efe9;
    --paper: #ffffff;
    --desk: #b9b7b0;
    --accent: #b8500f;
    --accent-2: #d97a28;
    --accent-bg: #fdf6ef;
    --shadow: 0 1px 2px rgba(20,20,25,.05), 0 8px 30px rgba(20,20,25,.13);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }

  * { box-sizing: border-box }

  html, body {
    margin: 0; padding: 0;
    background: var(--desk);
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ───────────────────────── top bar ───────────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 14px; align-items: center;
    padding: 0 18px; height: 46px;
    background: #1e1e22;
    color: #eceae4;
    font-size: 13px;
    border-bottom: 1px solid #000;
  }
  .bar .brand { font-weight: 620; letter-spacing: -.015em; font-size: 13.5px }
  .bar .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); flex: none }
  .bar .tip {
    font-family: var(--mono); font-size: 11px; color: #c9a071;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .bar .sp { flex: 1 }
  .bar .meta { font-family: var(--mono); font-size: 10.5px; color: #85858e; letter-spacing: .03em }
  .bar button {
    background: #303036; color: #eceae4;
    border: 1px solid #46464e; border-radius: 6px;
    padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .bar button:hover { background: #3c3c44; border-color: #63636e }

  /* ───────────────────────── sheet ───────────────────────── */
  .sheet {
    background: var(--paper);
    margin: 18px auto 26px;
    max-width: 1700px;
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto }

  .hit { cursor: pointer; fill: rgba(0,0,0,0); transition: fill .1s }
  .hit:hover { fill: rgba(217,122,40,.20); stroke: var(--accent); stroke-width: 1.6 }

  /* ───────────────────────── overlay card ───────────────────────── */
  .ov {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(16,16,19,.60);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 32px 20px 60px; overflow-y: auto;
  }
  .ov.on { display: flex }

  .card {
    background: var(--paper); border-radius: 14px;
    max-width: 1140px; width: 100%;
    box-shadow: 0 24px 70px rgba(0,0,0,.40);
    overflow: hidden;
    animation: rise .16s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  .chead {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 24px 16px; border-bottom: 1px solid var(--rule);
  }
  .chead .sw { width: 4px; height: 38px; border-radius: 2px; flex: none; margin-top: 3px }
  .chead h2 { margin: 0; font-size: 20px; letter-spacing: -.022em; font-weight: 640; line-height: 1.2 }
  .chead p { margin: 4px 0 0; font-size: 12px; color: var(--mute); font-family: var(--mono); letter-spacing: .01em }
  .chead .x {
    margin-left: auto; background: #f4f3ef; border: 1px solid var(--rule);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer;
    font-size: 14px; color: var(--ink-2); flex: none; line-height: 1;
  }
  .chead .x:hover { background: #eae9e3 }

  .crumb {
    padding: 9px 24px; background: #fbfaf7; border-bottom: 1px solid var(--rule-2);
    font-size: 11px; font-family: var(--mono); color: var(--faint);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .crumb button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0 }
  .crumb button:hover { text-decoration: underline }

  .cbody { padding: 20px 24px 26px }

  .dsvg {
    border: 1px solid var(--rule); border-radius: 10px;
    background: #fdfdfb; padding: 14px; overflow-x: auto;
  }
  .dsvg + .dsvg { margin-top: 12px }

  .sect {
    font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--faint);
    margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-2);
  }

  .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px }
  .notes li { font-size: 13.5px; line-height: 1.5; color: #35353c; padding-left: 17px; position: relative; max-width: 92ch }
  .notes li:before {
    content: ''; position: absolute; left: 0; top: .60em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
  }
  .notes b { color: var(--ink); font-weight: 620 }
  .notes code { font-family: var(--mono); font-size: 12px; background: #f4f3ef; padding: 1px 5px; border-radius: 4px }

  .chips { display: flex; gap: 8px; flex-wrap: wrap }
  .chips button {
    background: #fff; border: 1px solid #dddcd4; border-radius: 20px;
    padding: 6px 14px; font: inherit; font-size: 12.5px; cursor: pointer; color: #3a3a42;
    transition: all .12s;
  }
  .chips button:hover { border-color: var(--accent-2); color: var(--accent); background: var(--accent-bg) }

  .lnk { margin-top: 20px; font-size: 12.5px; color: var(--mute) }
  .lnk a { color: var(--accent) }

  .dm { transition: fill .1s }
  .drillmark { cursor: pointer }

  /* ───────────────────────── live demo controls ───────────────────────── */
  .demo {
    margin-top: 12px; border: 1px solid var(--rule); border-radius: 10px;
    background: #fbfaf7; padding: 13px 15px;
  }
  .demo h4 {
    margin: 0 0 11px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .13em; text-transform: uppercase; color: var(--faint); font-weight: 500;
  }
  .demo h4 span { color: var(--accent); }
  .ctl { display: flex; gap: 18px; align-items: center; flex-wrap: wrap }
  .ctl .grp { display: flex; gap: 6px; align-items: center }
  .ctl label { font-family: var(--mono); font-size: 11px; color: var(--mute) }

  .sw6 {
    width: 34px; height: 30px; border-radius: 7px; cursor: pointer;
    border: 1px solid #d5d4cc; background: #fff; color: var(--faint);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.05; padding: 0; transition: all .12s;
  }
  .sw6 .n { font-size: 8px; letter-spacing: .04em; color: var(--faint) }
  .sw6.on { background: var(--accent); border-color: var(--accent); color: #fff }
  .sw6.on .n { color: rgba(255,255,255,.72) }
  .sw6:hover { border-color: var(--accent-2) }

  .demo select, .demo input[type=text] {
    font: inherit; font-family: var(--mono); font-size: 12px;
    padding: 5px 9px; border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; color: var(--ink);
  }
  .demo button.act {
    font: inherit; font-size: 12px; padding: 6px 12px;
    border: 1px solid #d5d4cc; border-radius: 7px; background: #fff; cursor: pointer; color: #3a3a42;
  }
  .demo button.act:hover { border-color: var(--accent-2); color: var(--accent) }

  .led {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    padding: 6px 13px; border-radius: 7px; border: 1px solid;
    background: #f2f1ec; border-color: #ddddd4; color: var(--faint);
  }
  .led.hi { background: #1f7a44; border-color: #176034; color: #fff }

  .hexout { font-family: var(--mono); font-size: 11.5px; color: var(--mute) }
  .hexout b { color: var(--ink); font-weight: 600 }


  /* ───────────────────────── provenance table (bob) ───────────────────────── */
  .kv { width: 100%; border-collapse: collapse; font-size: 12.5px }
  .kv td { padding: 7px 10px; border-bottom: 1px solid var(--rule-2); vertical-align: top; line-height: 1.45 }
  .kv td:first-child { width: 34%; font-family: var(--mono); font-size: 11.5px; color: var(--ink) }
  .kv td:last-child { color: #35353c }
  .kv code, .notes code { font-family: var(--mono); font-size: 11.5px; background: #f4f3ef; padding: 1px 5px; border-radius: 4px }
  .kv tr:last-child td { border-bottom: none }

  /* ───────────────────────── print ───────────────────────── */
  @media print {
    html, body { background: #fff }
    .bar, .ov { display: none !important }
    .sheet { margin: 0; max-width: none; box-shadow: none; border-radius: 0 }
    .hit { display: none }
  }
</style>

<div class="bar">
  <span class="dot"></span>
  <span class="brand">bob — FPGA inside the XC7Z020 · M21 fabric (49 CLBs)</span>
  <span class="tip">▸ click any block to open it</span>
  <span class="sp"></span>
  <span class="meta">A3 landscape · ⌘P → Save as PDF</span>
  <button onclick="print()">Print / PDF</button>
</div>

<div class="sheet"><div id="out"></div></div>

<div class="ov" id="ov">
  <div class="card">
    <div class="chead">
      <div class="sw" id="dsw"></div>
      <div>
        <h2 id="dtitle"></h2>
        <p id="dsub"></p>
      </div>
      <button class="x" id="dx" title="close (Esc)">✕</button>
    </div>
    <div class="crumb" id="dcrumb"></div>
    <div class="cbody">
      <div id="dschemw"><div class="dsvg" id="dschem"></div><div id="ddemo"></div></div>
      <div id="drowsw"><div class="sect" id="drowshdr">Block diagram</div><div class="dsvg" id="ddiag"></div></div>
      <div id="dnotesw">
        <div class="sect">Key points</div>
        <ul class="notes" id="dnotes"></ul>
      </div>
      <div id="ddrillw">
        <div class="sect">Open a sub-block</div>
        <div class="chips" id="ddrill"></div>
      </div>
      <div id="dsrcw"><div class="sect">Where it comes from</div><table class="kv" id="dsrc"></table></div>
      <div id="dwhyw"><div class="sect">Why that source</div><ul class="notes" id="dwhy"></ul></div>
      <div id="dfilesw"><div class="sect">Files that implement / use it</div><table class="kv" id="dfiles"></table></div>
      <div id="dtbw"><div class="sect">Verified by</div><table class="kv" id="dtb"></table></div>
      <div class="lnk" id="dlnk"></div>
    </div>
  </div>
</div>

<script>
  "use strict";
  /* ============================================================================
     PALETTE  —  each family:  f = fill, s = stroke, t = text
     ========================================================================= */
  const C = {
    CLB:  { f: "#dce8f7", s: "#3f76ad", t: "#1d4b78" },
    BRAM: { f: "#d7ecdc", s: "#3d8a58", t: "#1f5c38" },
    DSP:  { f: "#f9e7c8", s: "#b3801f", t: "#78530f" },
    CMT:  { f: "#e6dcf3", s: "#7a58ab", t: "#4d3273" },
    IO:   { f: "#eae5db", s: "#8c8271", t: "#544d3f" },
    CFG:  { f: "#f8dbd3", s: "#bb5340", t: "#8a3423" },
    GTX:  { f: "#d6eaed", s: "#3a8189", t: "#215257" },
    HARD: { f: "#e0e5ea", s: "#68757f", t: "#39434b" },
    BRD:  { f: "#f2f1ec", s: "#7d7669", t: "#3a352c" },
    SOFT: { s: "#c05a12", t: "#8f4108", f: "rgba(192,90,18,.05)" },
    DIE:  { s: "#26262a" },
    INK: "#17171a", MUTE: "#74747e", FAINT: "#9a9aa4",
    LINE: "#b9b9b2", RULE: "#e4e4dd",
    WIRE: "#5c5c64", HOT: "#d97a28", HOT2: "#b8500f", GRN: "#1f7a44"
  };
  const MONO = "ui-monospace,'SF Mono',Menlo,Consolas,monospace";
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  /* ============================================================================
     PRIMITIVES  —  every helper pushes markup into the current buffer S
     ========================================================================= */
  let S = [];

  function rect(x, y, w, h, o = {}) {
    S.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 2}"`
      + ` fill="${o.f ?? "none"}" stroke="${o.s ?? "none"}" stroke-width="${o.sw ?? 1}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.cls ? ` class="${o.cls}"` : "")
      + (o.op ? ` opacity="${o.op}"` : "") + "/>");
  }

  function txt(x, y, s, o = {}) {
    const rot = o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : "";
    S.push(`<text x="${x}" y="${y}"${rot} font-size="${o.size ?? 9}"`
      + ` fill="${o.fill ?? C.INK}" text-anchor="${o.anchor ?? "middle"}"`
      + ` font-weight="${o.w ?? 400}" font-family="${o.mono ? MONO : "inherit"}"`
      + ` letter-spacing="${o.ls ?? 0}"`
      + (o.op ? ` opacity="${o.op}"` : "") + `>${esc(s)}</text>`);
  }

  function line(x1, y1, x2, y2, o = {}) {
    S.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.s ?? C.LINE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function path(d, o = {}) {
    S.push(`<path d="${d}" fill="${o.f ?? "none"}" stroke="${o.s ?? C.WIRE}"`
      + ` stroke-width="${o.sw ?? 1}" stroke-linejoin="round" stroke-linecap="${o.cap ?? "butt"}"`
      + (o.dash ? ` stroke-dasharray="${o.dash}"` : "")
      + (o.marker ? ` marker-end="url(#${o.marker})"` : "") + "/>");
  }

  function block(x, y, w, h, name, cap, k, o = {}) {
    rect(x, y, w, h, { f: k.f, s: k.s, sw: o.sw ?? 1.1, rx: o.rx ?? 3 });
    const cy = y + h / 2;
    if (cap) {
      txt(x + w / 2, cy - 1, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
      txt(x + w / 2, cy + 10, cap, { size: o.cs ?? 7.2, fill: C.MUTE, mono: true });
    } else {
      txt(x + w / 2, cy + 3.4, name, { size: o.size ?? 9.5, w: 640, fill: k.t, mono: o.mono });
    }
  }

  /* transparent click target — always emitted last so it sits above the art.
     fill is a presentation attribute so the markup survives a CSS-less export. */
  function hit(id, x, y, w, h, rx) {
    S.push(`<rect class="hit" data-id="${id}" x="${x}" y="${y}" width="${w}" height="${h}"`
      + ` rx="${rx ?? 3}" fill="transparent" pointer-events="all"/>`);
  }

  /* ============================================================================
     SCHEMATIC TOOLKIT  —  real symbols, not labelled rectangles
     ========================================================================= */

  /* wire through a list of [x,y] points, orthogonal as drawn */
  function wire(pts, o = {}) {
    path("M" + pts.map(p => p.join(",")).join(" L"),
      { s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, dash: o.dash, marker: o.marker, cap: "round" });
  }

  /* junction dot */
  function dot(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.1}" fill="${o.s ?? C.WIRE}"/>`);
  }

  /* open pin circle (port boundary) */
  function port(x, y, o = {}) {
    S.push(`<circle cx="${x}" cy="${y}" r="${o.r ?? 2.6}" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
  }

  /* multiplexer — the classic tapered trapezoid.
     dir "r" = inputs on the left, output right.  sel drawn on the bottom edge. */
  function mux(x, y, w, h, o = {}) {
    const t = o.taper ?? Math.min(h * 0.22, 9);
    path(`M${x},${y} L${x + w},${y + t} L${x + w},${y + h - t} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.label) txt(x + w / 2 + 1, y + h / 2 + (o.lo ?? 3), o.label,
      { size: o.ls2 ?? 7.4, fill: o.lf ?? C.MUTE, mono: true, w: 600 });
    return { in: i => [x, y + h * i], out: [x + w, y + h / 2], sel: [x + w / 2, y + h] };
  }

  /* flip-flop / register — box with the clock wedge on the lower-left */
  function ff(x, y, w, h, o = {}) {
    rect(x, y, w, h, { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1, rx: 1.5 });
    path(`M${x},${y + h - 11} L${x + 8},${y + h - 6.5} L${x},${y + h - 2}`,
      { s: o.s ?? C.WIRE, sw: 1.1 });
    if (o.label) txt(x + w / 2 + 3, y + h / 2 - 1, o.label, { size: o.ls2 ?? 7.6, fill: o.lf ?? C.INK, w: 620 });
    if (o.sub) txt(x + w / 2 + 3, y + h / 2 + 8.5, o.sub, { size: 6.2, fill: C.FAINT, mono: true });
    return { d: [x, y + 10], clk: [x, y + h - 6.5], q: [x + w, y + h / 2] };
  }

  /* buffer / inverter triangle pointing right */
  function buf(x, y, w, h, o = {}) {
    path(`M${x},${y} L${x + w},${y + h / 2} L${x},${y + h} Z`,
      { f: o.f ?? "#fff", s: o.s ?? C.WIRE, sw: o.sw ?? 1.1 });
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${o.s ?? C.WIRE}" stroke-width="1.1"/>`);
    return { in: [x, y + h / 2], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* AND / OR / XOR gate bodies (IEEE distinctive shapes) */
  function gate(kind, x, y, w, h, o = {}) {
    const s = o.s ?? C.WIRE, f = o.f ?? "#fff", sw = o.sw ?? 1.1;
    if (kind === "and") {
      path(`M${x},${y} L${x + w * .45},${y} A${w * .55},${h / 2} 0 0 1 ${x + w * .45},${y + h} L${x},${y + h} Z`, { f, s, sw });
    } else {
      const back = kind === "xor" ? 5 : 0;
      path(`M${x + back},${y} Q${x + back + w * .55},${y + h * .06} ${x + w},${y + h / 2}`
        + ` Q${x + back + w * .55},${y + h * .94} ${x + back},${y + h}`
        + ` Q${x + back + w * .22},${y + h / 2} ${x + back},${y} Z`, { f, s, sw });
      if (kind === "xor") path(`M${x},${y} Q${x + w * .22},${y + h / 2} ${x},${y + h}`, { s, sw });
    }
    if (o.inv) S.push(`<circle cx="${x + w + 2.4}" cy="${y + h / 2}" r="2.4" fill="#fff" stroke="${s}" stroke-width="${sw}"/>`);
    if (o.label) txt(x + w * .42, y + h / 2 + 2.6, o.label, { size: 6.4, fill: C.FAINT, mono: true });
    return { a: [x, y + h * .28], b: [x, y + h * .72], out: [x + w + (o.inv ? 4.8 : 0), y + h / 2] };
  }

  /* NMOS pass transistor — the thing a routing PIP and a LUT mux leg really are.
     `flip` puts the gate on the right, so a mirrored pair never crosses its own leads. */
  function nmos(x, y, o = {}) {
    const s = o.s ?? C.WIRE, h = o.h ?? 16, w = 7, d = o.flip ? 1 : -1;
    line(x, y, x, y + h, { s, sw: 1.3 });                              // channel
    line(x + d * w, y + 2, x + d * w, y + h - 2, { s, sw: 1.1 });       // gate plate
    line(x + d * w, y + h / 2, x + d * 14, y + h / 2, { s, sw: 1 });    // gate lead
    return { g: [x + d * 14, y + h / 2], s1: [x, y], s2: [x, y + h] };
  }

  /* the same device rotated for a left-to-right signal, as in an SRAM access
     transistor. The two leads jog perpendicular into the channel bar — without that
     jog the bar is collinear with the wire and the symbol reads as a capacitor.
     `y` is the level of the signal wire; the gate lead runs up to `gateTo`. */
  function nmosH(x, y, o = {}) {
    const s = o.s ?? C.WIRE, w = o.w ?? 28;
    const ch = y - 8, plate = y - 15, gy = o.gateTo ?? y - 34;
    line(x, y, x, ch, { s, sw: 1.1 });                           // left lead
    line(x + w, y, x + w, ch, { s, sw: 1.1 });                   // right lead
    line(x, ch, x + w, ch, { s, sw: 1.4 });                      // channel bar
    line(x + 3, plate, x + w - 3, plate, { s, sw: 1.4 });        // gate plate
    line(x + w / 2, plate, x + w / 2, gy, { s, sw: 1 });         // gate lead
    return { g: [x + w / 2, gy], t1: [x, y], t2: [x + w, y] };
  }

  /* a single SRAM configuration cell, drawn as a small square.
     v = 0/1 fills it; hot = highlight as the selected cell */
  function cell(x, y, w, h, v, o = {}) {
    const on = !!v;
    rect(x, y, w, h, {
      f: o.hot ? C.HOT : (on ? (o.onf ?? "#3f76ad") : (o.off ?? "#eef1f4")),
      s: o.hot ? C.HOT2 : (o.s ?? "#b6c2ce"), sw: o.hot ? 1.3 : .6, rx: 1
    });
    if (o.showv && h >= 8) txt(x + w / 2, y + h / 2 + 2.6, on ? "1" : "0",
      { size: 6, mono: true, fill: o.hot ? "#fff" : (on ? "#fff" : C.FAINT), w: 700 });
  }

  /* ============================================================================
     one logic element (ble.sv; clb.sv until M20)  —  live: flags, inputs, one clock edge
     ========================================================================= */
  const BLE = { i0: 1, i1: 0, cin: 1, ce: 1, sr: 0, q: 0, fn: "add",
    f: { ff_en: 1, ff_rstval: 0, ff_ce_en: 1, ff_sr_en: 1, cy_en: 1, cy_di_sel: 0, ff_d_sel: 0 }, gsr: 0, gwe: 1 };
  function bleEval() {
    const i = BLE.i0 | (BLE.i1 << 1), t = LUTFN[BLE.fn].f;
    const o6 = t(i), o5 = t(i & 31), f = BLE.f;
    const di = f.cy_di_sel ? o5 : BLE.i0;
    const comb = f.cy_en ? (o6 ^ BLE.cin) : (f.ff_d_sel ? o5 : o6);
    const cout = f.cy_en ? (o6 ? BLE.cin : di) : 0;
    const o = f.ff_en ? BLE.q : comb;
    return { o6, o5, di, comb, cout, o };
  }
  function bleClock() {
    const e = bleEval(), f = BLE.f;
    if (BLE.gsr) BLE.q = f.ff_rstval;
    else if (!BLE.gwe) { /* hold */ }
    else if (f.ff_sr_en && BLE.sr) BLE.q = f.ff_rstval;
    else if (!f.ff_ce_en || BLE.ce) BLE.q = e.comb;
  }

    wire([[402, 324], [440, 324], [440, 44]], { s: hot(e.cout), sw: 1.6, marker: "ah" });
    txt(448, 52, "COUT → CLB above", { size: 7, anchor: "start", mono: true, fill: C.DSP.t }); val(430, 60, e.cout);

    const dm = mux(520, 150, 26, 60, { label: "D", ls2: 7 });
    wire([[464, 111], [500, 111], [500, 165], [520, 165]], { s: hot(e.o6 ^ BLE.cin), sw: 1.2 });
    wire([[266, 230], [500, 230], [500, 195], [520, 195]], { s: hot(e.o5), sw: 1 });
    cap(533, 222, f.cy_en ? "sum" : (f.ff_d_sel ? "O5" : "O6"));

    wire([[560, 270], [655, 270], [655, 214]], { s: hot(BLE.sr), sw: 1.1 }); txt(520, 280, `SR ${f.ff_sr_en ? "(routed)" : "(ignored)"}`, { size: 6.8, mono: true, anchor: "start", fill: C.MUTE });
    wire([[570, 300], [590, 300], [590, 207], [600, 207]], { s: C.CMT.s, sw: 1.1 }); txt(520, 304, "sysclk · gce · GSR · GWE", { size: 6.8, mono: true, anchor: "start", fill: C.CMT.t });
    val(700, 140, BLE.q, { label: "q" });

    wire([[304, 232], [304, 390], [880, 390]], { s: C.GRN, sw: 1.3, dash: "4 3", marker: "ahg" });
    txt(890, 394, "O5 → OPIN", { size: 9.4, anchor: "start", mono: true, w: 700, fill: C.GRN }); val(990, 390, e.o5);

    /* the 7 flags as chain cells */
    const fl = ["ff_en", "ff_rstval", "ff_ce_en", "ff_sr_en", "cy_en", "cy_di_sel", "ff_d_sel"];

    txt(0, 492, "UG474 semantics: SR beats CE (FDRE/FDSE), CO = S ? CI : DI, sum = S ⊕ CI. Every flag is a chain bit; the eight input pins are rr-graph IPIN muxes.", { size: 8, anchor: "start", fill: C.MUTE });
    return svg(1064, 506, 900);

      gate("xor", X + 150, y + 26, 30, 24, {}); txt(X + 165, y + 62, "XORCY", { size: 6, mono: true, fill: C.FAINT });

    hdr(0, 16, "clock_ctrl.v — one real clock (sysclk), the user clock is the enable gce");
    rect(20, 60, 140, 40, { f: C.BRD.f, s: C.BRD.s, rx: 4 }); txt(90, 84, "TCK (async)", { size: 9, w: 640 });
    const a = ff(200, 56, 40, 48, { label: "s0" }), b = ff(260, 56, 40, 48, { label: "s1" });
    wire([[160, 80], [200, 66]]); wire([[240, 80], [260, 66]]); cap(250, 118, "ASYNC_REG synchroniser");
    const d1 = ff(330, 56, 40, 48, { label: "d" }); wire([[300, 80], [330, 66]]);
    const ga = gate("and", 420, 60, 40, 36, {}); wire([[300, 80], [310, 80], [310, 130], [410, 130], [410, 70], [420, 70]]);
    wire([[370, 80], [400, 80], [400, 86], [420, 86]], { s: C.WIRE }); cap(440, 108, "rise");
    const g2 = gate("and", 500, 60, 40, 36, {}); wire([[460, 78], [500, 70]]);
    rect(360, 150, 110, 30, { f: C.CFG.f, s: C.CFG.s, rx: 4 }); txt(415, 170, "USER1 ce (sync)", { size: 8 });
    wire([[470, 165], [490, 165], [490, 86], [500, 86]], { s: CLK.ce ? C.HOT : C.WIRE, sw: CLK.ce ? 1.6 : 1 });
    const go = gate("or", 580, 60, 40, 44, {}); wire([[540, 78], [580, 72]]);
    rect(360, 200, 190, 30, { f: C.CFG.f, s: C.CFG.s, rx: 4 }); txt(455, 220, "USER1 step / INTEST autostep ↑", { size: 8 });
    wire([[550, 215], [570, 215], [570, 92], [580, 92]]);
    rect(360, 260, 190, 44, { f: C.CMT.f, s: C.CMT.s, rx: 4 }); txt(455, 280, "counter", { size: 9, w: 640, fill: C.CMT.t });
    txt(455, 294, `period 2^(${CLK.div}+8) = ${2 ** (CLK.div + 8)} cycles`, { size: 7, mono: true, fill: C.MUTE });
    const m = mux(680, 60, 30, 250, { label: "mode", ls2: 7 });
    wire([[624, 82], [680, 82]], { s: CLK.mode ? C.WIRE : C.HOT, sw: CLK.mode ? 1 : 2 });
    wire([[550, 282], [680, 282]], { s: CLK.mode ? C.HOT : C.WIRE, sw: CLK.mode ? 2 : 1 });
    cap(695, 330, `clk_mode = ${CLK.mode} (ctrl tile bit 0)`);
    const fg = ff(760, 160, 60, 50, { label: "gce" }); wire([[710, 185], [760, 170]], { s: C.HOT, sw: 2 });
    wire([[820, 185], [1000, 185]], { s: C.HOT, sw: 2, marker: "ahh" }); txt(910, 176, "→ every CLB / BRAM / DSP register", { size: 8, mono: true, fill: C.HOT2 });
    rect(760, 250, 240, 40, { f: C.CMT.f, s: C.CMT.s, rx: 4 }); txt(880, 274, "sysclk 125 MHz · H16 · BUFG", { size: 9, w: 640, fill: C.CMT.t });
    wire([[880, 250], [880, 230], [770, 230], [770, 204], [760, 204]], { s: C.CMT.s });
    const hz = 125e6 / 2 ** (CLK.div + 8);
    frame(20, 360, 1034, 90, "WHAT IT MEANS", { bg: "#fdfdfb" });
    txt(40, 390, CLK.mode ? `free-running: ${hz >= 1000 ? (hz / 1000).toFixed(1) + " kHz" : hz.toFixed(2) + " Hz"} user clock (div ${CLK.div}); hwtest counter-run uses div 16 = 7.45 Hz`
      : `JTAG-stepped: one gce per TCK rising edge while ce = ${CLK.ce}; step/autostep give exactly one`, { size: 9.4, anchor: "start", mono: true, w: 600 });
    txt(40, 414, "gce pulses are ≥ 512 sysclk cycles apart → pynq_z2.xdc gives fabric paths a 512-cycle multicycle (UG949: enables, not generated clocks).", { size: 8, anchor: "start", fill: C.MUTE });
    return svg(1064, 466, 900);
  };
  DEMO.clock = {
    html: `<div class="demo"><h4>Live — <span>clock mode and divider</span></h4><div class="ctl">
      <div class="grp"><button class="sw6" data-clk="mode"><span class="n">MODE</span><span class="v">0</span></button><button class="sw6" data-clk="ce"><span class="n">CE</span><span class="v">1</span></button></div>
      <div class="grp"><label>clk_div</label><input type="range" min="0" max="23" id="clkdiv" value="0"><span class="hexout" id="clkdv">0</span></div></div></div>`,
    wire(redraw) {
      const sync = () => { document.querySelectorAll("[data-clk]").forEach(b => { const v = CLK[b.dataset.clk]; b.classList.toggle("on", !!v); b.querySelector(".v").textContent = v; }); document.getElementById("clkdv").textContent = CLK.div; };
      document.querySelectorAll("[data-clk]").forEach(b => b.onclick = () => { CLK[b.dataset.clk] ^= 1; redraw(); sync(); });
      const r = document.getElementById("clkdiv"); r.value = CLK.div; r.oninput = () => { CLK.div = +r.value; redraw(); sync(); };
      sync();
    }
  };

  /* ============================================================================
     BLOCK-DIAGRAM RENDERER  —  the row/flow layout used by pages without a schematic
     ========================================================================= */
  const DW = 1040;
  function wrapTxt(s, maxc) {
    const w = String(s).split(" "), out = []; let cur = "";
    w.forEach(t => { if ((cur + " " + t).trim().length <= maxc) cur = (cur + " " + t).trim(); else { out.push(cur); cur = t; } });
    if (cur) out.push(cur);
    return out.slice(0, 2);
  }

  function renderRows(d) {
    S = [];
    let y = 14;
    const rows = d.rows || [];
    rows.forEach((row, ri) => {
      if (row.label) {
        txt(2, y + 7, row.label.toUpperCase(), { size: 7.4, anchor: "start", fill: C.FAINT, mono: true, ls: .9 });
        y += 16;
      }
      const items = row.items.filter(Boolean);
      const n = items.length, gap = row.t === "flow" ? 26 : 10;
      const bw = (DW - gap * (n - 1)) / n, bh = 54;
      items.forEach(([name, cap2, drill, kind], i) => {
        const x = i * (bw + gap), k = C[kind || d.k] || C.CLB;
        rect(x, y, bw, bh, {
          f: k.f, s: k.s, sw: drill ? 1.6 : 1, rx: 4,
          dash: kind === "SOFTK" ? "5 3" : null, cls: drill ? "dm" : null
        });
        const nl = wrapTxt(name, Math.max(10, Math.floor(bw / 6.1)));
        const capl = cap2 ? wrapTxt(cap2, Math.max(12, Math.floor(bw / 4.3))) : [];
        let ty = bh / 2 - (nl.length - 1) * 5.5 - capl.length * 4.6 + 3;
        nl.forEach(l => { txt(x + bw / 2, y + ty, l, { size: 9.2, w: 640, fill: k.t }); ty += 11; });
        capl.forEach(l => { txt(x + bw / 2, y + ty + 1, l, { size: 6.9, fill: C.MUTE, mono: true }); ty += 9; });
        if (drill) {
          txt(x + bw - 7, y + 12, "▸", { size: 9, anchor: "end", fill: C.HOT, w: 700 });
          S.push(`<rect class="hit" data-id="${drill}" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="transparent" pointer-events="all"/>`);
        }
        if (row.t === "flow" && i < n - 1)
          line(x + bw + 3, y + bh / 2, x + bw + gap - 3, y + bh / 2, { s: "#8e8e86", sw: 1.3, marker: "ah" });
      });
      y += bh;
      if (ri < rows.length - 1) { line(DW / 2, y, DW / 2, y + 14, { s: "#cbcbc3", sw: 1.2 }); y += 14; }
    });
    return svg(DW, y + 8, Math.min(DW, 760));
  }

  /* ============================================================================
     NAVIGATION
     ========================================================================= */
  const ov = document.getElementById("ov");
  const $ = id => document.getElementById(id);
  let stack = [];

  function openPage(id) {
    if (!DET[id]) return;
    if (stack[stack.length - 1] !== id) stack.push(id);
    paint();
  }

  /* redraw only the live schematic — used by the demo controls */
  function redrawSchem(id) {
    if (SCHEM[id]) $("dschem").innerHTML = SCHEM[id]();
  }

  /* a running animation must never outlive the page that owns it, or it would
     keep repainting #dschem after the user has navigated somewhere else */
  function stopAnimations() {
    if (CARRY.timer) { clearInterval(CARRY.timer); CARRY.timer = null; }
  }

  function paint() {
    stopAnimations();
    const id = stack[stack.length - 1], d = DET[id], k = C[d.k] || C.CLB;

    $("dsw").style.background = k.s;
    $("dtitle").textContent = d.title;
    $("dsub").textContent = d.sub || "";

    /* schematic + live controls */
    const sw = $("dschemw");
    if (SCHEM[id]) {
      sw.style.display = "";
      redrawSchem(id);
      const dem = $("ddemo");
      if (DEMO[id]) { dem.innerHTML = DEMO[id].html; DEMO[id].wire(() => redrawSchem(id)); }
      else dem.innerHTML = "";
    } else { sw.style.display = "none"; $("ddemo").innerHTML = ""; }

    /* block diagram */
    const rw = $("drowsw");
    if (d.rows && d.rows.length) {
      rw.style.display = "";
      $("drowshdr").textContent = SCHEM[id] ? "The same block, as a signal flow" : "Block diagram";
      $("ddiag").innerHTML = renderRows(d);
    } else rw.style.display = "none";

    /* breadcrumb */
    const cr = $("dcrumb");
    cr.innerHTML = stack.map((s, i) =>
      i === stack.length - 1
        ? `<span style="color:#35353c">${esc(DET[s].title.split(" — ")[0])}</span>`
        : `<button data-i="${i}">${esc(DET[s].title.split(" — ")[0])}</button><span>›</span>`
    ).join(" ") + (stack.length > 1 ? `<span style="margin-left:auto;color:#b6b6ae">⌫ back · Esc close</span>` : "");
    cr.querySelectorAll("button").forEach(b => b.onclick = () => { stack = stack.slice(0, +b.dataset.i + 1); paint(); });

    /* notes */
    const nw = $("dnotesw");
    if (d.notes && d.notes.length) {
      nw.style.display = "";
      $("dnotes").innerHTML = d.notes.map(n => `<li>${n}</li>`).join("");
    } else nw.style.display = "none";

    /* sub-blocks */
    const dw = $("ddrillw");
    const dr = (d.drill || []).filter(x => DET[x]);
    if (dr.length) {
      dw.style.display = "";
      $("ddrill").innerHTML = dr.map(x =>
        `<button data-go="${x}">${esc(DET[x].title.split(" — ")[0])} ▸</button>`).join("");
      $("ddrill").querySelectorAll("button").forEach(b => b.onclick = () => openPage(b.dataset.go));
    } else dw.style.display = "none";

    const kv = (w, t, rows) => {
      if (rows && rows.length) { $(w).style.display = ""; $(t).innerHTML = rows.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join(""); }
      else $(w).style.display = "none";
    };
    kv("dsrcw", "dsrc", d.src); kv("dfilesw", "dfiles", d.files); kv("dtbw", "dtb", d.tb);
    if (d.why && d.why.length) { $("dwhyw").style.display = ""; $("dwhy").innerHTML = d.why.map(n => `<li>${n}</li>`).join(""); }
    else $("dwhyw").style.display = "none";

    $("dlnk").innerHTML = d.stage
      ? `Deeper reading in the repo: <a href="${d.stage}">${d.stage}</a>`
      : "";

    ov.classList.add("on");
    ov.scrollTop = 0;
  }

  function closeOv() { stopAnimations(); ov.classList.remove("on"); stack = []; }

  $("out").addEventListener("click", e => {
    const t = e.target.closest("[data-id]"); if (t) openPage(t.dataset.id);
  });
  ["ddiag", "dschem"].forEach(el => $(el).addEventListener("click", e => {
    const t = e.target.closest("[data-id]"); if (t) openPage(t.dataset.id);
  }));
  $("dx").onclick = closeOv;
  ov.addEventListener("click", e => { if (e.target === ov) closeOv(); });
  addEventListener("keydown", e => {
    if (!ov.classList.contains("on")) return;
    if (e.key === "Escape") closeOv();
    if ((e.key === "Backspace" || e.key === "ArrowLeft") && stack.length > 1) { e.preventDefault(); stack.pop(); paint(); }
  });

  /* ── dev sanity check: every hotspot must land on a page ── */
  (function audit() {
    const ids = [...document.querySelectorAll("#out [data-id]")].map(n => n.dataset.id);
    const missing = [...new Set(ids)].filter(i => !DET[i]);
    if (missing.length) console.warn("hotspots with no detail page:", missing);
    const bad = [];
    Object.entries(DET).forEach(([k, d]) => {
      (d.drill || []).forEach(x => { if (!DET[x]) bad.push(k + " → " + x); });
      (d.rows || []).forEach(r => r.items.filter(Boolean).forEach(it => {
        if (it[2] && !DET[it[2]]) bad.push(k + " row → " + it[2]);
      }));
    });
    if (bad.length) console.warn("dangling drill links:", bad);
    const noSchem = Object.keys(SCHEM).filter(k => !DET[k]);
    if (noSchem.length) console.warn("schematics with no page:", noSchem);
    console.log("pages:", Object.keys(DET).length, "| schematics:", Object.keys(SCHEM).length,
      "| live demos:", Object.keys(DEMO).length, "| hotspots:", ids.length);
  })();
</script>
